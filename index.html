    function todayISO() {

    }
    function isoOffset(days) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function atOffset(days, hm = "09:30") { return `${isoOffset(days)}T${hm}:00`; }
    function nowStamp() {

      return `${todayISO()}T${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:00`;
    }
    function addDays(iso, days) {
      const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
      const dt = new Date(y || 2000, (m || 1) - 1, d || 1);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function formatDate(iso) {
      const [y, m, d] = (iso || "").slice(0, 10).split("-").map(Number);
      return y && m && d ? `${y}年${m}月${d}日` : (iso || "");
    }
    function weekday(iso) {
      const [y, m, d] = (iso || "").slice(0, 10).split("-").map(Number);
      return "日一二三四五六"[new Date(y, (m || 1) - 1, d || 1).getDay()] ?? "";
    }
    function formatWhen(iso) { return `${formatDate(iso)} ${(iso || "").slice(11, 16)}`.trim(); }
    function uid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
    function esc(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function imgSrc(path) {
      if (!path) return "";
      if (path.startsWith("data:") || path.startsWith("http")) return path;
      if (path.startsWith("/photos/")) return `./public${path}`;
      if (path.startsWith("public/")) return `./${path}`;
      return path;
    }
    function imgTag(src, alt, cls) {
      const resolved = imgSrc(src);
      const fallback = src && src.startsWith("/photos/") ? `.${src}` : "";
      return `<img src="${esc(resolved)}" alt="${esc(alt)}" class="${esc(cls)}" ${fallback ? `onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='${esc(fallback)}'}"` : ""} />`;
    }
    function siteProgress(site) {
      if (!site.trades || !site.trades.length) return 0;
      return Math.round(site.trades.reduce((n, t) => n + t.progress, 0) / site.trades.length);

    // =========================================================================
    // Permissions: canSeeSite / canSeeTask / can() — enforced on EVERY write
    // =========================================================================
    function canSeeSite(user, site) {
      if (!user || !site) return false;
      if (user.role === "platform_admin") return false;
      if (user.companyId !== site.companyId) return false;
      if (user.role === "company_admin" || user.role === "project_manager") return true;
      if (user.role === "site_supervisor") return site.supervisorId === user.id;
      return Array.isArray(site.assignedSubIds) && site.assignedSubIds.includes(user.id);
    }

    function canSeeTask(user, task, site) {
      if (!site || !canSeeSite(user, site)) return false;
      if (user.role === "subcontractor") return task.assigneeId === user.id || task.subId === user.id;
      return true;
    }

    function can(user, action, site) {
      if (!user) return false;
      if (user.role === "platform_admin") return action === "manage_billing" || action === "view_admin" || action === "view_billing";
      if (site && user.companyId !== site.companyId) return false;
      if (site && !canSeeSite(user, site)) return false;
      const r = user.role;
      switch (action) {
        case "view_admin":
        case "manage_billing": return false;
        case "view_billing":
        case "view_reports": return r === "company_admin" || r === "project_manager" || r === "site_supervisor";
        case "view_people": return r !== "subcontractor";
        case "manage_people": return r === "company_admin";
        case "assign_sub":
        case "create_site":
        case "nudge_log":
        case "instruct": return r === "company_admin" || r === "project_manager";
        case "edit_site":
        case "create_log":
        case "edit_log":
        case "approve_task":
        case "create_material":
        case "edit_material":
        case "upload_file":
        case "close_day": return r === "company_admin" || r === "project_manager" || r === "site_supervisor";
        case "create_task":
        case "update_task":
        case "request_material":
        case "check_in": return true;
        default: return false;
      }
    }

    // =========================================================================
    // Store + Legacy localStorage (deitong-demo-v1) Merge
    // =========================================================================
    function loadStore() {
      const base = createDemoData();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        const saved = parsed?.state ?? parsed ?? {};
        return {
          ...base,
          ...saved,
          checkins: Array.isArray(saved.checkins) ? saved.checkins : base.checkins,
          nudges: Array.isArray(saved.nudges) ? saved.nudges : base.nudges,
          dayCloses: Array.isArray(saved.dayCloses) ? saved.dayCloses : base.dayCloses,
          instructions: Array.isArray(saved.instructions) ? saved.instructions : base.instructions,
          touches: Array.isArray(saved.touches) ? saved.touches : base.touches,
          catalog: saved.catalog && Array.isArray(saved.catalog.processes) && Array.isArray(saved.catalog.trades) ? saved.catalog : base.catalog,
          featureFlags: { ...DEFAULT_FEATURE_FLAGS, ...(saved.featureFlags ?? {}) },
        };
      } catch {
        return base;
      }
    }

    let state = loadStore();
    let runtime = {
      authMode: "demo",        // "demo" | "firebase"
      cloudEmail: null,
      cloudStatus: "offline",  // "offline" | "connecting" | "connected" | "error"
      moreOpen: false,
      adminTab: "features",
      siteTab: "overview",
      taskFilter: "全部",
      activeTaskId: null,
      modal: null,             // null | "log" | "task" | "snag" | "material" | "site" | "person"
      modalSiteId: null,
      noteBox: null,           // { siteId, mode: "nudge" | "instruct" | "close" }
      workerAside: null,       // { siteId, mode: "leave" | "absent" }
      askMatOpen: false,
      fbApp: null,
      fbAuth: null,
      fbDb: null,
    };

    function saveStore() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, version: 0 }));
      } catch {
        // ignore quota
      }
    }

    // =========================================================================
    // Firebase Lazy Loader (ESM CDN — reads browser localStorage config, zero hardcoded keys!)
    // =========================================================================
    function getSavedFbConfig() {
      try {
        const raw = localStorage.getItem(FB_CONFIG_KEY);
        if (!raw) return { apiKey: "", authDomain: "renocamp-site.firebaseapp.com", projectId: "renocamp-site", storageBucket: "renocamp-site.firebasestorage.app", messagingSenderId: "544840282779", appId: "1:544840282779:web:a22ea9d881b1c595ea0c3e" };
        return JSON.parse(raw);
      } catch {
        return { apiKey: "", authDomain: "renocamp-site.firebaseapp.com", projectId: "renocamp-site", storageBucket: "renocamp-site.firebasestorage.app", messagingSenderId: "544840282779", appId: "1:544840282779:web:a22ea9d881b1c595ea0c3e" };
      }
    }
    function hasFbConfig(cfg = getSavedFbConfig()) {
      return Boolean(cfg.apiKey && cfg.authDomain && cfg.projectId && cfg.appId);
    }

    let fbMods = null;
    async function initFirebaseIfReady() {
      const cfg = getSavedFbConfig();
      if (!hasFbConfig(cfg)) return null;
      if (runtime.fbApp) return { app: runtime.fbApp, auth: runtime.fbAuth, db: runtime.fbDb, mods: fbMods };
      const [appMod, authMod, fsMod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"),
      ]);
      fbMods = { appMod, authMod, fsMod };
      const apps = appMod.getApps();
      runtime.fbApp = apps.length ? apps[0] : appMod.initializeApp(cfg);
      runtime.fbAuth = authMod.getAuth(runtime.fbApp);
      runtime.fbDb = fsMod.getFirestore(runtime.fbApp);
      authMod.onAuthStateChanged(runtime.fbAuth, (fbUser) => {
        if (!fbUser) return;
        void hydrateCloudUser(fbUser);
      });
      return { app: runtime.fbApp, auth: runtime.fbAuth, db: runtime.fbDb, mods: fbMods };
    }

    async function hydrateCloudUser(fbUser) {
      if (!fbMods || !runtime.fbDb) return;
      const { fsMod } = fbMods;
      const token = await fbUser.getIdTokenResult();
      let role = token.claims.role || null;
      let companyId = token.claims.companyId || null;
      let name = fbUser.displayName || (fbUser.email || "").split("@")[0] || "用戶";
      try {
        const snap = await fsMod.getDoc(fsMod.doc(runtime.fbDb, "users", fbUser.uid));
        if (snap.exists()) {
          const d = snap.data();
          if (!role && d.role) role = d.role;
          if (!companyId && d.companyId) companyId = d.companyId;
          if (d.name) name = d.name;
        }
      } catch { /* fallback to claims */ }
      if (!role) return;
      const member = {
        id: fbUser.uid,
        companyId: role === "platform_admin" ? null : companyId,
        name,
        role,
        title: ROLE_LABEL[role] || "成員",
        phone: "已驗證",
        trade: null,
        blurb: `Firebase 雲端帳戶（${fbUser.email || ""}）`,
      };
      if (!state.members.some((m) => m.id === member.id)) state.members.push(member);
      else state.members = state.members.map((m) => (m.id === member.id ? member : m));
      state.sessionUserId = member.id;
      runtime.authMode = "firebase";
      runtime.cloudEmail = fbUser.email || "";
      runtime.cloudStatus = "connected";
      saveStore();
      render();
    }

    async function cloudLogin(email, password) {
      if (!hasFbConfig()) return { ok: false, error: "請先去超級管理員「Firebase 設定」貼上 apiKey 並儲存。" };
      if (!email.trim() || !password) return { ok: false, error: "請輸入電郵同密碼。" };
      try {
        const fb = await initFirebaseIfReady();
        const cred = await fb.mods.authMod.signInWithEmailAndPassword(fb.auth, email.trim(), password);
        await hydrateCloudUser(cred.user);
        if (runtime.authMode !== "firebase") {
          await fb.mods.authMod.signOut(fb.auth);
          return { ok: false, error: "此帳戶尚未喺 Firestore /users/{uid} 設定 role。" };
        }
        return { ok: true };
      } catch (err) {
        return { ok: false, error: err?.message || "登入失敗，請檢查電郵同密碼。" };
      }
    }

    // =========================================================================
    // Scope & Store Actions (double-checked via can())
    // =========================================================================
    function getUser() { return state.members.find((m) => m.id === state.sessionUserId) ?? null; }
    function getScope() {
      const user = getUser();
      const company = state.companies.find((c) => c.id === user?.companyId) ?? null;
      const sites = user ? state.sites.filter((s) => canSeeSite(user, s)) : [];
      const siteMap = new Map(state.sites.map((s) => [s.id, s]));
      const tasks = user ? state.tasks.filter((t) => canSeeTask(user, t, siteMap.get(t.siteId))) : [];
      const siteIds = new Set(sites.map((s) => s.id));
      const logs = state.logs
        .filter((l) => siteIds.has(l.siteId))
        .map((l) => (user?.role === "subcontractor" ? { ...l, work: "", deliveries: "", issues: "", headcount: [], photos: [], revisions: [] } : l));
      const materials = state.materials.filter((m) => siteIds.has(m.siteId));
      const files = state.files.filter((f) => siteIds.has(f.siteId));
      const people = !user ? [] : user.role === "subcontractor" ? state.members.filter((m) => m.id === user.id) : state.members.filter((m) => m.companyId === user.companyId);
      return {
        user, company, sites, tasks, logs, materials, files, people,
        checkins: state.checkins.filter((r) => siteIds.has(r.siteId)),
        nudges: state.nudges.filter((r) => siteIds.has(r.siteId)),
        dayCloses: state.dayCloses.filter((r) => siteIds.has(r.siteId)),
        instructions: state.instructions.filter((r) => siteIds.has(r.siteId)),
        touches: user?.role === "platform_admin" ? state.touches : state.touches.filter((r) => r.companyId === user?.companyId),
      };
    }

    function mutArrive(siteId) {
      const user = getUser();
      const site = state.sites.find((s) => s.id === siteId);
      if (!user || !site || !can(user, "check_in", site)) return { ok: false, error: "你唔係呢個盤嘅人" };
      const date = todayISO(), stamp = nowStamp();
      const existing = state.checkins.find((r) => r.siteId === siteId && r.memberId === user.id && r.date === date);
      if (existing && !existing.leftAt && !existing.absent) return { ok: false, error: "你已經報到，未收工。" };
      if (existing) {
        Object.assign(existing, { leftAt: null, arrivedAt: stamp, absent: false, note: "" });
      } else {
        state.checkins.unshift({ id: uid("in"), companyId: site.companyId, siteId, memberId: user.id, memberName: user.name, trade: user.trade || user.title, date, arrivedAt: stamp, leftAt: null, note: "", absent: false });
      }
      saveStore();
      return { ok: true };
    }
    function mutLeave(siteId, note = "") {
      const user = getUser();
      const site = state.sites.find((s) => s.id === siteId);
      if (!user || !site || !can(user, "check_in", site)) return { ok: false, error: "你唔係呢個盤嘅人" };
      const row = state.checkins.find((r) => r.siteId === siteId && r.memberId === user.id && r.date === todayISO() && !r.leftAt && !r.absent);
      if (!row) return { ok: false, error: "你今日未報到，或者已經收工。" };
      row.leftAt = nowStamp();
      row.note = note.trim();
      saveStore();
      return { ok: true };
    }
    function mutAbsent(siteId, reason) {
      const user = getUser();
      const site = state.sites.find((s) => s.id === siteId);
      if (!user || !site || !can(user, "check_in", site)) return { ok: false, error: "你唔係呢個盤嘅人" };
      if (!reason.trim()) return { ok: false, error: "寫低點解今日去唔到" };
      const date = todayISO();
      const existing = state.checkins.find((r) => r.siteId === siteId && r.memberId === user.id && r.date === date);
      if (existing && !existing.leftAt && !existing.absent) return { ok: false, error: "你已經喺場。要走先收工，唔好標去唔到。" };
      if (existing?.absent) return { ok: false, error: "你已經話過今日去唔到。" };
      if (existing) return { ok: false, error: "你今日已經收過工。" };
      const stamp = nowStamp();
      state.checkins.unshift({ id: uid("in"), companyId: site.companyId, siteId, memberId: user.id, memberName: user.name, trade: user.trade || user.title, date, arrivedAt: stamp, leftAt: stamp, note: reason.trim(), absent: true });
      saveStore();
      return { ok: true };
    }
    function mutCloseDay(siteId, note) {
      const user = getUser();
      const site = state.sites.find((s) => s.id === siteId);
      if (!user || !site || !can(user, "close_day", site)) return { ok: false, error: "你冇權限幫呢個盤收工" };
      if (!note.trim()) return { ok: false, error: "寫低今日有咩要交帶" };
      const date = todayISO();
      if (logState(state.logs, siteId, date) !== "submitted") return { ok: false, error: "未交今日日誌。提交咗先算收工。" };
      const openReviews = state.tasks.filter((t) => t.siteId === siteId && t.status === "review").length;
      const existing = state.dayCloses.find((r) => r.siteId === siteId && r.date === date);
      const row = { id: existing?.id ?? uid("close"), companyId: site.companyId, siteId, date, byName: user.name, note: note.trim(), at: nowStamp(), openReviews };
      if (existing) Object.assign(existing, row); else state.dayCloses.unshift(row);
      saveStore();
      return { ok: true, warning: openReviews ? `已收工。仲有 ${openReviews} 張單等驗收，聽日第一時間收。` : "" };
    }

    // =========================================================================
    // Hash Router
    // =========================================================================
    function getPath() {
      const raw = (location.hash || "#/").replace(/^#/, "");
      return raw.startsWith("/") ? raw : `/${raw}`;
    }
    function go(path) {
      location.hash = `#${path}`;
    }
    window.addEventListener("hashchange", () => {
      runtime.moreOpen = false;
      render();
    });

    function brandMark(size = "md") {

    function loopRailHtml(kicker, items) {
      const firstFail = items.findIndex((x) => !x.pass);
      const steps = items.map((x, i) => ({ ...x, state: firstFail === -1 || i < firstFail ? "done" : i === firstFail ? "now" : "wait" }));
      const cur = steps.find((s) => s.state === "now");
      return `
        <div class="rounded-3xl border border-line bg-card p-4 shadow-card" data-testid="loop-rail">
          <p class="text-xs font-bold text-gold-2">今日閉環</p>
          <p class="text-xl font-black">${esc(kicker)}</p>
          <ol class="mt-3">
            ${steps.map((step, i) => {
              const cls = step.state === "done" ? "bg-navy text-paper" : step.state === "now" ? "bg-gold text-ink" : "bg-paper-2 text-muted";
              return `
                <li class="flex gap-3">
                  <div class="flex flex-col items-center">
                    <span class="grid size-8 shrink-0 place-items-center rounded-full text-xs font-black ${cls}">${step.state === "done" ? "✓" : i + 1}</span>
                    ${i < steps.length - 1 ? `<span class="min-h-4 w-0.5 flex-1 ${step.state === "done" ? "bg-navy" : "bg-line"}"></span>` : ""}
                  </div>
                  <div class="pb-3">
                    <p class="text-sm font-bold ${step.state === "wait" ? "text-muted" : ""}">${esc(step.label)}</p>
                    <p class="text-xs text-muted">${esc(step.hint)}</p>
                  </div>
                </li>`;

    function renderOverview() {
      const { user, sites, tasks, logs, materials, checkins, nudges, dayCloses, instructions } = getScope();
      if (user.role === "platform_admin") { go("/app/admin"); return ""; }
      const today = todayISO();
      const soon2 = isoOffset(2);
      const dueSoon = tasks.filter((t) => t.status !== "done" && t.due > today && t.due <= soon2);
      const matSoon = materials.filter((m) => m.status !== "delivered" && m.neededBy > today && m.neededBy <= soon2);

      let loopHtml = "";
      if (user.role === "subcontractor") {
        const mineToday = checkins.filter((r) => r.memberId === user.id && r.date === today);
        const reported = (sid) => mineToday.find((r) => r.siteId === sid);
        const allRep = sites.length === 0 || sites.every((s) => reported(s.id));
        const allFin = sites.length > 0 && sites.every((s) => { const r = reported(s.id); return r && (r.absent || r.leftAt); });
        const fresh = tasks.filter((t) => t.status === "pending" || t.status === "unassigned");
        const doing = tasks.filter((t) => t.status === "in_progress");
        const waiting = tasks.filter((t) => t.status === "review");
        const myCalls = materials.filter((m) => m.note.startsWith(`工人叫料：${user.name}`) && m.status !== "delivered");
        loopHtml = `
          ${loopRailHtml("工人一日", [
            { label: "到場", hint: allRep ? "每個盤都報過到，或者話咗去唔到" : "仲有盤未報到", pass: allRep },
            { label: "開工", hint: fresh.length ? `仲有 ${fresh.length} 張未開始` : "未開始嘅單已清空", pass: fresh.length === 0 },
            { label: "做完交相", hint: doing.length ? `${doing.length} 張做緊／要改` : "冇單留喺你手", pass: doing.length === 0 },
            { label: "等主管收", hint: waiting.length ? `${waiting.length} 張等驗收` : "冇單卡喺驗收", pass: waiting.length === 0 },
            { label: "收工", hint: allFin ? "每個盤都收工或去唔到" : "做完記得撳收工", pass: sites.length === 0 || allFin },
          ])}
          ${sites.map((s) => {
            const mine = reported(s.id);
            const st = mine?.absent ? "今日去唔到" : mine && !mine.leftAt ? "已到場" : mine ? "今日已收工" : "未報到";
            return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2">
              <p class="font-bold">${esc(s.name)}</p>
              <p class="text-xs text-muted">${st}${mine?.note ? ` · ${esc(mine.note)}` : ""}</p>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" data-arrive="${s.id}" class="min-h-11 rounded-full bg-navy px-3 text-xs font-bold text-paper">我到場</button>
                <button type="button" data-leave="${s.id}" class="min-h-11 rounded-full bg-paper-2 px-3 text-xs font-bold text-ink">我收工</button>
                <button type="button" data-absent="${s.id}" class="min-h-11 rounded-full border border-line bg-card px-3 text-xs font-bold text-ink">今日去唔到</button>
              </div>
            </div>`;
          }).join("")}
          ${myCalls.length ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><h3 class="font-bold">你叫過嘅料</h3>${myCalls.map((m) => `<div class="flex items-center justify-between text-sm"><span>${esc(m.name)} · ${esc(m.qty)} · ${esc(MATERIAL_LABEL[m.status])}</span>${m.status === "ordered" ? `<button type="button" data-confirm-mat="${m.id}" class="rounded-full bg-gold px-3 py-1.5 text-xs font-bold text-ink">我收到</button>` : ""}</div>`).join("")}</div>` : ""}`;
      } else {
        const selfRun = user.role === "company_admin" && sites.length > 0 && sites.every((s) => s.supervisorId === user.id);
        const missing = sites.filter((s) => logState(logs, s.id, today) !== "submitted");
        const reviews = tasks.filter((t) => t.status === "review");
        const pendingNotes = instructions.filter((r) => !r.ackAt);
        const closedCount = sites.filter((s) => dayCloses.some((r) => r.siteId === s.id && r.date === today)).length;
        const loose = tasks.filter((t) => t.status === "unassigned");
        const steps = selfRun
          ? [
              { label: "自己交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "你管嘅盤都交咗", pass: missing.length === 0 },
              { label: "驗收", hint: reviews.length ? `${reviews.length} 張等你收` : "冇單等驗收", pass: reviews.length === 0 },
              { label: "等自己回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "冇指示吊住", pass: pendingNotes.length === 0 },
              { label: "收工", hint: `收咗 ${closedCount}/${sites.length} 個盤`, pass: sites.length > 0 && closedCount === sites.length },
            ]
          : user.role === "site_supervisor"
          ? [
              { label: "點人", hint: checkins.some((r) => r.date === today) || logs.some((r) => r.date === today) ? "今日有人報到或已開日誌" : "未有人報到", pass: checkins.some((r) => r.date === today) || logs.some((r) => r.date === today) },
              { label: "交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "你管嘅盤都交咗", pass: missing.length === 0 },
              { label: "分派", hint: loose.length ? `${loose.length} 張未分派` : "張張有人跟", pass: loose.length === 0 },
              { label: "驗收", hint: reviews.length ? `${reviews.length} 張等你收` : "冇單等驗收", pass: reviews.length === 0 },
              { label: "回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "指示都回過", pass: pendingNotes.length === 0 },
              { label: "收工", hint: `收咗 ${closedCount}/${sites.length} 個盤`, pass: sites.length > 0 && closedCount === sites.length },
            ]
          : [
              { label: user.role === "project_manager" ? "睇邊個拖" : "數未交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "日誌齊", pass: missing.length === 0 },
              { label: "催主管", hint: missing.length ? "未交嘅盤可催主管" : "唔使催", pass: missing.length === 0 || missing.every((s) => nudges.some((n) => n.siteId === s.id && n.date === today && !n.resolvedAt)) },
              { label: "等現場回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "指示都有人回", pass: pendingNotes.length === 0 },
              { label: "等各盤收工", hint: `${closedCount}/${sites.length} 個盤收咗工`, pass: sites.length > 0 && closedCount === sites.length },

            <div class="grid gap-3 md:grid-cols-2">
              ${sites.map((s) => `<a href="#/app/sites/${s.id}" class="overflow-hidden rounded-3xl border border-line bg-card shadow-card block">
                ${imgTag(s.cover, s.name, "h-32 w-full object-cover")}
                <div class="p-4 space-y-1">
                  <p class="text-xs text-muted">${esc(s.district)} · ${esc(s.stage)}</p>
                  <p class="font-bold">${esc(s.name)}</p>
                  <div class="flex items-center gap-3"><div class="h-2 flex-1 overflow-hidden rounded-full bg-paper-2"><div class="h-full bg-navy" style="width:${siteProgress(s)}%"></div></div><span class="text-sm tabular-nums">${siteProgress(s)}%</span></div>

            </div>

        ${tab === "progress" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">${site.trades.map((t) => `<div><div class="flex justify-between text-sm"><span>${esc(t.name)}</span><span class="tabular-nums">${t.progress}%</span></div><div class="mt-1 h-2 overflow-hidden rounded-full bg-paper-2"><div class="h-full bg-navy" style="width:${t.progress}%"></div></div></div>`).join("")}</div>` : ""}
        ${tab === "logs" ? (user.role === "subcontractor"
          ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="font-bold">今日${LOG_STATE_LABEL[logState(siteLogs, site.id, todayISO())]}</p><p class="mt-1 text-sm text-muted">正式日誌由主管寫。你只睇到今日開唔開工，睇唔到日誌內文。</p></div>`
          : `<div class="space-y-3">${siteLogs.map((l) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="font-bold">${formatDate(l.date)} · ${esc(l.weather)} (${l.status === "draft" ? "草稿" : "已提交"})</p><p class="mt-1 text-sm">${l.noWork ? "今日無施工" : esc(l.work)}</p><p class="mt-1 text-xs text-muted">填寫人 ${esc(l.authorName)}</p></div>`).join("") || `<p class="text-sm text-muted">未有日誌。</p>`}</div>`) : ""}
        ${tab === "resources" ? `<div class="space-y-3"><div class="rounded-3xl border border-line bg-card p-4 shadow-card"><h2 class="font-bold">任務（${siteTasks.length}）</h2>${siteTasks.map((t) => `<p class="mt-1 text-sm">${esc(t.title)} · ${STATUS_LABEL[t.status]}</p>`).join("") || `<p class="text-sm text-muted">未有任務。</p>`}</div><div class="rounded-3xl border border-line bg-card p-4 shadow-card"><h2 class="font-bold">材料（${siteMats.length}）</h2>${siteMats.map((m) => `<p class="mt-1 text-sm">${esc(m.name)} · ${esc(m.qty)} · ${MATERIAL_LABEL[m.status]}</p>`).join("") || `<p class="text-sm text-muted">未有材料。</p>`}</div></div>` : ""}
        ${tab === "files" ? `<div class="grid gap-3 sm:grid-cols-2">${siteFiles.map((f) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card">${f.src ? imgTag(f.src, f.name, "mb-2 h-32 w-full rounded-2xl object-cover") : ""}<p class="font-bold">${esc(f.name)}</p><p class="text-xs text-muted">${esc(f.note)}</p></div>`).join("") || `<p class="text-sm text-muted">未有檔案。</p>`}</div>` : ""}
      </div>`;
    }

    function renderTasks() {
      const { user, tasks, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      const filters = ["全部", "今日", "逾期", "要改", "待驗收", "受阻", "執漏"];
      const today = todayISO();
      const rows = tasks.filter((t) => {
        if (runtime.taskFilter === "今日") return t.due === today && t.status !== "done";
        if (runtime.taskFilter === "逾期") return isOverdue(t, today);
        if (runtime.taskFilter === "要改") return Boolean(t.needsRework) && t.status !== "done";
        if (runtime.taskFilter === "待驗收") return t.status === "review";
        if (runtime.taskFilter === "受阻") return t.blocked;
        if (runtime.taskFilter === "執漏") return t.kind === "snag";
        return true;
      });
      return `<div class="space-y-4">
        <h1 class="text-3xl font-black">任務／執漏</h1>
        <div class="flex gap-2 overflow-x-auto">${filters.map((f) => `<button type="button" data-task-filter="${f}" class="min-h-11 shrink-0 rounded-full px-4 text-sm font-bold ${runtime.taskFilter === f ? "bg-navy text-paper" : "border border-line bg-card"}">${f}</button>`).join("")}</div>
        <div class="space-y-2">${rows.map((t) => {
          const site = sites.find((s) => s.id === t.siteId);
          return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card">
            <div class="flex flex-wrap gap-1.5 text-xs font-bold">
              <span class="rounded-full bg-paper-2 px-2.5 py-1">${STATUS_LABEL[t.status]}</span>
              ${t.blocked ? `<span class="rounded-full bg-clay-soft px-2.5 py-1 text-clay">受阻</span>` : ""}
              ${t.needsRework ? `<span class="rounded-full bg-clay-soft px-2.5 py-1 text-clay">要改</span>` : ""}
            </div>
            <p class="mt-2 font-bold">${esc(t.title)}</p>
            <p class="text-xs text-muted">${esc(site?.name ?? "")} · ${PRIORITY_LABEL[t.priority]} · ${formatDate(t.due)}</p>
          </div>`;
        }).join("") || `<p class="text-sm text-muted">呢個篩選下面暫時冇單。</p>`}</div>
      </div>`;
    }

        return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="text-xs text-muted">${esc(s?.name ?? "")}</p><p class="font-bold">${formatDate(l.date)} · ${esc(l.weather)} (${l.status === "draft" ? "草稿" : "已提交"})</p><p class="mt-1 text-sm">${l.noWork ? "今日無施工。" : esc(l.work)}</p><p class="mt-1 text-xs text-muted">填寫人 ${esc(l.authorName)}</p></div>`;

      const flags = state.featureFlags ?? DEFAULT_FEATURE_FLAGS;
      const ghSaved = (() => {
        try { return JSON.parse(localStorage.getItem(GH_DEPLOY_KEY) || "{}"); } catch { return {}; }
      })();
      const fbCfg = getSavedFbConfig();
      const tab = runtime.adminTab;
      const tabs = [["features", "功能開關"], ["members", "全平台成員"], ["deploy", "一鍵部署 GitHub"], ["firebase", "Firebase 設定"]];

                <button type="button" data-flag="${k}" class="min-h-11 rounded-full px-4 text-sm font-bold ${on ? "bg-navy text-paper" : "border border-line bg-card"}">${on ? "已開啟" : "已關閉"}</button>
              </div>`;
            }).join("")}
          </div>` : ""}

        ${tab === "members" ? `
          <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">

              return `<div class="flex items-center justify-between gap-2 rounded-2xl bg-paper-2 p-3">
                <div><p class="font-bold">${esc(m.name)}${m.disabled ? ' <span class="text-xs text-clay">（已停用）</span>' : ""}</p><p class="text-xs text-muted">${esc(comp?.shortName ?? "平台")} · ${ROLE_LABEL[m.role]} · ${esc(m.phone)}</p></div>

              </div>`;
            }).join("")}
          </div>` : ""}

        ${tab === "deploy" ? `
          <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">

              <label class="block text-sm"><span class="font-medium">Repo</span><input id="gh-repo" value="${esc(ghSaved.repo || "dipan-tong")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label>

          </div>` : ""}

        ${tab === "firebase" ? `
          <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">
            <h2 class="text-xl font-black">Firebase 雲端設定（renocamp-site）</h2>
            <p class="text-sm text-muted">設定只存於你瀏覽器 <code>localStorage</code>，唔會寫死喺公開 <code>index.html</code>，防止 GitHub 密鑰警告。</p>
            <div class="grid gap-2 md:grid-cols-2">
              ${["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"].map((k) => `<label class="block text-sm"><span class="font-medium">${k}</span><input id="fb-${k}" value="${esc(fbCfg[k] || "")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label>`).join("")}
            </div>
            <button type="button" id="btn-fb-save" class="min-h-11 rounded-full bg-gold px-5 text-sm font-black text-ink">儲存 Firebase 設定並啟用登入</button>
          </div>` : ""}

        <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">
          <h2 class="text-xl font-black">客戶公司訂閱（用量到頂只提醒，唔鎖唔刪）</h2>
          ${state.companies.map((c) => {
            const p = PLANS[c.plan];
            const sc = state.sites.filter((s) => s.companyId === c.id).length;
            const mc = state.members.filter((m) => m.companyId === c.id).length;
            return `<div class="rounded-2xl bg-paper-2 p-3 space-y-2">
              <div class="flex justify-between"><p class="font-bold">${esc(c.name)}</p><span class="rounded-full bg-navy px-2.5 py-0.5 text-xs font-bold text-paper">${p.name}</span></div>
              <p class="text-xs text-muted">工地 ${sc}/${p.sites} · 帳戶 ${mc}/${p.seats} · 儲存 ${c.storageUsedGb}/${p.gb} GB</p>
              ${c.status === "trial" ? `<button type="button" data-extend-trial="${c.id}" class="min-h-10 rounded-full bg-gold px-3 text-xs font-bold text-ink">試用加七日</button>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }

    // =========================================================================
    // Main Render & Event Wiring
    // =========================================================================
    function render() {
      const root = document.getElementById("app");
      const path = getPath();
      if (path === "/" || path === "") {
        root.innerHTML = renderMarketing();
      } else if (path === "/login") {
        root.innerHTML = renderLogin();
      } else if (path.startsWith("/app")) {
        let inner = "";
        if (path === "/app" || path === "/app/") inner = renderOverview();
        else if (path === "/app/sites") inner = renderSites();
        else if (path.startsWith("/app/sites/")) inner = renderSiteDetail(path.replace("/app/sites/", ""));
        else if (path === "/app/tasks") inner = renderTasks();
        else if (path === "/app/logs") inner = renderLogs();
        else if (path === "/app/people") inner = renderPeople();
        else if (path === "/app/materials") inner = renderMaterials();
        else if (path === "/app/files") inner = renderFiles();
        else if (path === "/app/reports") inner = renderReports();
        else if (path === "/app/billing") inner = renderBilling();
        else if (path === "/app/admin") inner = renderAdmin();
        else if (path === "/app/account") inner = renderAccount();
        else inner = renderOverview();
        root.innerHTML = renderAppShell(path, inner);
      } else {
        root.innerHTML = renderMarketing();
      }
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-scroll]").forEach((btn) => {
        btn.addEventListener("click", () => document.getElementById(btn.dataset.scroll)?.scrollIntoView({ behavior: "smooth" }));
      });
      document.querySelectorAll("[data-login]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const m = state.members.find((x) => x.id === btn.dataset.login);
          if (!m || m.disabled) return;
          state.sessionUserId = m.id;
          runtime.authMode = "demo";
          runtime.cloudEmail = null;
          runtime.cloudStatus = "offline";
          saveStore();
          go(m.role === "platform_admin" ? "/app/admin" : "/app");
        });
      });
      document.getElementById("cloud-login-btn")?.addEventListener("click", async () => {
        const email = document.getElementById("cloud-email")?.value || "";
        const pass = document.getElementById("cloud-pass")?.value || "";
        const errBox = document.getElementById("cloud-login-err");
        const res = await cloudLogin(email, pass);
        if (!res.ok) {
          if (errBox) { errBox.textContent = res.error; errBox.classList.remove("hidden"); }
          return;
        }
        toast("Firebase 登入成功！");
        const u = getUser();
        go(u?.role === "platform_admin" ? "/app/admin" : "/app");
      });
      document.getElementById("nav-more-btn")?.addEventListener("click", () => { runtime.moreOpen = true; render(); });
      document.getElementById("close-more-bg")?.addEventListener("click", () => { runtime.moreOpen = false; render(); });
      document.getElementById("close-more-x")?.addEventListener("click", () => { runtime.moreOpen = false; render(); });
      document.querySelectorAll("[data-site-tab]").forEach((b) => b.addEventListener("click", () => { runtime.siteTab = b.dataset.siteTab; render(); }));
      document.querySelectorAll("[data-task-filter]").forEach((b) => b.addEventListener("click", () => { runtime.taskFilter = b.dataset.taskFilter; render(); }));
      document.querySelectorAll("[data-admin-tab]").forEach((b) => b.addEventListener("click", () => { runtime.adminTab = b.dataset.adminTab; render(); }));

      // Worker attendance
      document.querySelectorAll("[data-arrive]").forEach((b) => b.addEventListener("click", () => {
        const r = mutArrive(b.dataset.arrive);
        toast(r.ok ? "已報到。主管寫日誌會見到你。" : r.error, r.ok ? "ok" : "bad");
        render();
      }));
      document.querySelectorAll("[data-leave]").forEach((b) => b.addEventListener("click", () => {
        const note = prompt("走之前交帶（冇就留空）：") ?? "";
        const r = mutLeave(b.dataset.leave, note);
        toast(r.ok ? "已收工。交帶主管睇到。" : r.error, r.ok ? "ok" : "bad");
        render();
      }));
      document.querySelectorAll("[data-absent]").forEach((b) => b.addEventListener("click", () => {
        const reason = prompt("寫低點解今日去唔到：") ?? "";
        const r = mutAbsent(b.dataset.absent, reason);
        toast(r.ok ? "已話俾主管知你今日去唔到。" : r.error, r.ok ? "ok" : "bad");
        render();
      }));

      // Super Admin toggles
      document.querySelectorAll("[data-flag]").forEach((b) => b.addEventListener("click", () => {
        const u = getUser();
        if (!can(u, "view_admin")) return toast("冇權限", "bad");
        const k = b.dataset.flag;
        state.featureFlags[k] = !(state.featureFlags[k] ?? true);
        saveStore();
        toast(`已${state.featureFlags[k] ? "開啟" : "關閉"}「${FEATURE_LABELS[k].label}」`);
        render();
      }));
      document.querySelectorAll("[data-toggle-member]").forEach((b) => b.addEventListener("click", () => {
        const u = getUser();
        if (!can(u, "view_admin")) return toast("冇權限", "bad");
        const m = state.members.find((x) => x.id === b.dataset.toggleMember);
        if (!m || m.id === u.id) return;
        m.disabled = !m.disabled;
        saveStore();
        toast(`已${m.disabled ? "停用" : "啟用"}${m.name}`);
        render();
      }));
      document.querySelectorAll("[data-extend-trial]").forEach((b) => b.addEventListener("click", () => {
        const u = getUser();
        if (!can(u, "manage_billing")) return toast("冇權限", "bad");
        const c = state.companies.find((x) => x.id === b.dataset.extendTrial);
        if (!c || c.status !== "trial") return;
        const base = c.trialEnds && c.trialEnds > todayISO() ? c.trialEnds : todayISO();
        c.trialEnds = addDays(base, 7);
        saveStore();
        toast(`已幫${c.shortName}試用加七日至 ${c.trialEnds}`);
        render();
      }));

      // One-Click Push index.html to GitHub
      document.getElementById("btn-gh-save")?.addEventListener("click", () => {
        const cfg = {
          owner: document.getElementById("gh-owner").value.trim(),
          repo: document.getElementById("gh-repo").value.trim(),
          branch: document.getElementById("gh-branch").value.trim() || "main",
          path: document.getElementById("gh-path").value.trim() || "index.html",
          token: document.getElementById("gh-pat").value.trim(),
        };
        localStorage.setItem(GH_DEPLOY_KEY, JSON.stringify(cfg));
        toast("已儲存 GitHub 設定喺呢部瀏覽器");
      });
      document.getElementById("btn-gh-push")?.addEventListener("click", async () => {
        const owner = document.getElementById("gh-owner").value.trim();
        const repo = document.getElementById("gh-repo").value.trim();
        const branch = document.getElementById("gh-branch").value.trim() || "main";
        const path = document.getElementById("gh-path").value.trim() || "index.html";
        const token = document.getElementById("gh-pat").value.trim();
        if (!token) return toast("請先貼上 GitHub Token（Contents: Read & Write）", "bad");
        localStorage.setItem(GH_DEPLOY_KEY, JSON.stringify({ owner, repo, branch, path, token }));
        try {
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}`;
          const headers = { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          let sha;
          const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers });
          if (getRes.ok) { const j = await getRes.json(); sha = j.sha; }
          const html = "<!doctype html>\n" + document.documentElement.outerHTML;
          const bytes = new TextEncoder().encode(html);
          let bin = "";
          for (const b of bytes) bin += String.fromCharCode(b);
          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers,
            body: JSON.stringify({ message: `deploy: update ${path} from Deitong Super Admin`, content: btoa(bin), branch, ...(sha ? { sha } : {}) }),
          });
          if (!putRes.ok) {
            const err = await putRes.json().catch(() => ({}));
            return toast(`推送失敗：${err.message || putRes.status}`, "bad");
          }
          toast("已成功一鍵推送 index.html 到 GitHub！");
        } catch (err) {
          toast(`推送錯誤：${err?.message || "連線失敗"}`, "bad");
        }
      });

      // Firebase config save
      document.getElementById("btn-fb-save")?.addEventListener("click", () => {
        const cfg = {};
        for (const k of ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"]) {
          cfg[k] = (document.getElementById(`fb-${k}`)?.value || "").trim();
        }
        localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
        toast("已儲存 Firebase 設定！去登入頁即可用電郵密碼登入。");
        void initFirebaseIfReady();
      });

      // Sign out & reset
      document.getElementById("btn-signout")?.addEventListener("click", async () => {
        if (runtime.fbAuth && fbMods) await fbMods.authMod.signOut(runtime.fbAuth);
        state.sessionUserId = null;
        runtime.authMode = "demo";
        runtime.cloudEmail = null;
        runtime.cloudStatus = "offline";
        saveStore();
        go("/");
      });
      document.getElementById("btn-reset-demo")?.addEventListener("click", () => {
        const keep = state.sessionUserId;
        state = createDemoData();
        state.sessionUserId = keep;
        saveStore();
        toast("示範資料已重設。");
        render();
      });
    }

    // Boot
    void initFirebaseIfReady();
    render();
  </script>
</body>
</html>
