    function canSeeSite(user, site) {

      if (user.role === "site_supervisor") return site.supervisorId === user.id;
      return Array.isArray(site.assignedSubIds) && site.assignedSubIds.includes(user.id);
    }
    function canSeeTask(user, task, site) {
      if (!site || !canSeeSite(user, site)) return false;
      if (user.role === "subcontractor") return task.assigneeId === user.id || task.subId === user.id;
      return true;
    }
    function can(user, action, site) {
      if (!user) return false;
      if (user.role === "platform_admin") return action === "manage_billing" || action === "view_admin" || action === "view_billing";
      if (site && (user.companyId !== site.companyId || !canSeeSite(user, site))) return false;
      const r = user.role;
      switch (action) {
        case "view_admin": case "manage_billing": return false;
        case "view_billing": case "view_reports": return r === "company_admin" || r === "project_manager" || r === "site_supervisor";
        case "view_people": return r !== "subcontractor";
        case "manage_people": return r === "company_admin";
        case "assign_sub": case "create_site": case "nudge_log": case "instruct": return r === "company_admin" || r === "project_manager";

        default: return false;

          if (d.name) name = d.name;
        }
      } catch { /* fallback */ }
      if (!role) return;
      const member = { id: fbUser.uid, companyId: role === "platform_admin" ? null : companyId, name, role, title: ROLE_LABEL[role] || "成員", phone: "已驗證", trade: null, blurb: `Firebase 雲端帳戶（${fbUser.email || ""}）` };
      if (!state.members.some((m) => m.id === member.id)) state.members.push(member);
      else state.members = state.members.map((m) => (m.id === member.id ? member : m));
      state.sessionUserId = member.id;
      runtime.authMode = "firebase";
      runtime.cloudEmail = fbUser.email || "";
      runtime.cloudStatus = "connected";
      saveStore();
      render();
    }

    async function cloudLogin(email, password) {
      if (!hasFbConfig()) return { ok: false, error: "請先去超級管理員「Firebase 設定」貼上 apiKey 並儲存。" };
      if (!email.trim() || !password) return { ok: false, error: "請輸入電郵同密碼。" };
      try {
        const fb = await initFirebaseIfReady();
        const cred = await fb.mods.authMod.signInWithEmailAndPassword(fb.auth, email.trim(), password);
        await hydrateCloudUser(cred.user);
        if (runtime.authMode !== "firebase") { await fb.mods.authMod.signOut(fb.auth); return { ok: false, error: "此帳戶尚未喺 Firestore /users/{uid} 設定 role。" }; }
        return { ok: true };
      } catch (err) { return { ok: false, error: err?.message || "登入失敗，請檢查電郵同密碼。" }; }
    }

    // =========================================================================
    // Scope & Store Mutations (every write double-checked via can())
    // =========================================================================
    function getUser() { return state.members.find((m) => m.id === state.sessionUserId) ?? null; }
    function getScope() {
      const user = getUser();
      const company = state.companies.find((c) => c.id === user?.companyId) ?? null;
      const sites = user ? state.sites.filter((s) => canSeeSite(user, s)) : [];
      const siteMap = new Map(state.sites.map((s) => [s.id, s]));
      const tasks = user ? state.tasks.filter((t) => canSeeTask(user, t, siteMap.get(t.siteId))) : [];
      const siteIds = new Set(sites.map((s) => s.id));
      const logs = state.logs.filter((l) => siteIds.has(l.siteId)).map((l) => (user?.role === "subcontractor" ? { ...l, work: "", deliveries: "", issues: "", headcount: [], photos: [], revisions: [] } : l));
      const materials = state.materials.filter((m) => siteIds.has(m.siteId));
      const files = state.files.filter((f) => siteIds.has(f.siteId));
      const people = !user ? [] : user.role === "subcontractor" ? state.members.filter((m) => m.id === user.id) : state.members.filter((m) => m.companyId === user.companyId);
      return {
        user, company, sites, tasks, logs, materials, files, people,
        checkins: state.checkins.filter((r) => siteIds.has(r.siteId)),
        nudges: state.nudges.filter((r) => siteIds.has(r.siteId)),
        dayCloses: state.dayCloses.filter((r) => siteIds.has(r.siteId)),
        instructions: state.instructions.filter((r) => siteIds.has(r.siteId)),
        touches: user?.role === "platform_admin" ? state.touches : state.touches.filter((r) => r.companyId === user?.companyId),
      };
    }

    function mutSaveLog(input) {
      const user = getUser();
      const site = state.sites.find((s) => s.id === input.siteId);
      if (!user || !site) return { ok: false, error: "搵唔到工地" };
      const editing = input.id ? state.logs.find((l) => l.id === input.id) : null;
      if (input.id && !editing) return { ok: false, error: "搵唔到呢份日誌" };
      if (editing && (editing.companyId !== site.companyId || editing.siteId !== site.id)) return { ok: false, error: "你冇權限改呢份日誌" };
      if (!can(user, editing ? "edit_log" : "create_log", site)) return { ok: false, error: "你冇權限寫呢個工地嘅日誌" };
      if (!input.date || !input.authorName.trim()) return { ok: false, error: "請填日期同填寫人" };
      if (!input.noWork && !input.work.trim()) return { ok: false, error: "請寫今日做咗咩，或者剔「今日無施工」" };
      const stamp = nowStamp();
      const headcount = (input.headcount || []).filter((h) => h.trade.trim() && h.count > 0);
      const isSubmitted = Boolean(input.submit) || editing?.status === "submitted";
      let savedLog;
      if (editing) {
        const revs = [...(editing.revisions || [])];
        if (editing.status === "submitted" || input.submit) revs.push({ at: stamp, byName: user.name, note: input.submit && editing.status === "draft" ? "由草稿提交" : "改過內容" });
        Object.assign(editing, { date: input.date, weather: input.weather || "天晴", authorName: input.authorName.trim(), headcount, noWork: input.noWork, work: input.noWork ? "" : input.work.trim(), deliveries: input.deliveries.trim(), issues: input.issues.trim(), status: isSubmitted ? "submitted" : "draft", revisions: revs, updatedAt: stamp });
        savedLog = editing;
      } else {
        savedLog = { id: uid("log"), companyId: site.companyId, siteId: site.id, date: input.date, weather: input.weather || "天晴", authorName: input.authorName.trim(), authorId: user.id, headcount, noWork: input.noWork, work: input.noWork ? "" : input.work.trim(), deliveries: input.deliveries.trim(), issues: input.issues.trim(), photos: [], status: input.submit ? "submitted" : "draft", revisions: [], updatedAt: stamp };
        state.logs.unshift(savedLog);
      }
      if (isSubmitted) {
        state.nudges = state.nudges.map((n) => (n.siteId === site.id && n.date === input.date && !n.resolvedAt ? { ...n, resolvedAt: stamp } : n));
      }
      saveStore();
      void cloudWrite(["companies", savedLog.companyId, "sites", savedLog.siteId, "logs", savedLog.id], savedLog);
      return { ok: true };
    }

    function mutSaveTask(input) {
      const user = getUser();
      const site = state.sites.find((s) => s.id === input.siteId);
      if (!user || !site || !can(user, "create_task", site)) return { ok: false, error: "你冇權限喺呢個工地開單" };
      if (!input.title.trim() || !input.due) return { ok: false, error: "請寫標題同期限" };
      let assigneeId = input.assigneeId || null;
      let subId = null;
      if (user.role === "subcontractor") {
        if (assigneeId && assigneeId !== user.id) return { ok: false, error: "分判唔可以派單畀其他人" };
        assigneeId = user.id;
        subId = user.id;

      if (person?.role === "subcontractor" && !site.assignedSubIds.includes(person.id)) {

      }
      const stamp = nowStamp();
      const task = { id: uid("task"), companyId: site.companyId, siteId: site.id, kind: input.kind || "task", title: input.title.trim(), location: (input.location || "").trim(), description: (input.description || "").trim(), photos: [], donePhotos: [], assigneeId, subId, priority: input.priority || "normal", due: input.due, status: assigneeId ? "pending" : "unassigned", blocked: false, blockReason: "", needsRework: false, activity: [{ at: stamp, byName: user.name, action: assigneeId ? "開咗呢張單，並分派" : "開咗呢張單，未分派" }], updatedAt: stamp };

    function mutActTask(taskId, cmd) {
      const user = getUser();
      const task = state.tasks.find((t) => t.id === taskId);
      const site = task ? state.sites.find((s) => s.id === task.siteId) : null;
      if (!user || !task || !site || !canSeeTask(user, task, site)) return { ok: false, error: "你冇權限睇呢張單" };
      const stamp = nowStamp();
      const push = (a) => task.activity.push({ at: stamp, byName: user.name, action: a });
      let warning = "";
      if (cmd.type === "assign") {
        if (!can(user, "approve_task", site)) return { ok: false, error: "分判唔可以改派" };
        const person = state.members.find((m) => m.id === cmd.assigneeId);
        if (!person || person.companyId !== site.companyId) return { ok: false, error: "呢個人唔係呢間公司" };
        task.assigneeId = person.id;
        if (person.role === "subcontractor") {
          task.subId = person.id;
          if (!site.assignedSubIds.includes(person.id)) { site.assignedSubIds.push(person.id); warning = `已將${person.name}加入${site.name}。`; }
        }
        if (task.status === "unassigned") task.status = "pending";
        push(`改派畀${person.name}`);
      } else if (cmd.type === "start") {
        if (!can(user, "update_task", site)) return { ok: false, error: "冇權限" };
        if (task.status === "done" || task.status === "review") return { ok: false, error: "呢張單而家唔可以重新開工" };
        task.status = "in_progress";
        if (!task.assigneeId) task.assigneeId = user.id;
        push("開始處理");
      } else if (cmd.type === "review") {
        if (!can(user, "update_task", site)) return { ok: false, error: "冇權限" };
        if (task.status !== "in_progress" && task.status !== "pending") return { ok: false, error: "未開始交唔到去驗收" };
        task.status = "review";
        task.needsRework = false;
        if (cmd.donePhotos?.length) task.donePhotos.push(...cmd.donePhotos);
        push(cmd.donePhotos?.length ? "交去驗收，附上完工相" : "交去驗收");
      } else if (cmd.type === "approve") {
        if (!can(user, "approve_task", site)) return { ok: false, error: "驗收要主管、經理或老闆先得" };
        if (task.blocked) return { ok: false, error: "受阻緊，未可以驗收" };
        if (task.status !== "review") return { ok: false, error: "未交到驗收" };
        task.status = "done";
        task.needsRework = false;
        push("驗收完成");
      } else if (cmd.type === "return") {
        if (!can(user, "approve_task", site)) return { ok: false, error: "退回要主管、經理或老闆先得" };
        if (!cmd.note?.trim()) return { ok: false, error: "請寫退回原因" };
        if (task.status !== "review") return { ok: false, error: "呢張單唔係待驗收" };
        task.status = "in_progress";
        task.needsRework = true;
        push(`退回修改：${cmd.note.trim()}`);
      } else if (cmd.type === "block") {
        if (!can(user, "update_task", site) || task.status === "done") return { ok: false, error: "無法標記受阻" };
        if (!cmd.reason?.trim()) return { ok: false, error: "請寫受阻原因" };
        task.blocked = true;
        task.blockReason = cmd.reason.trim();
        push(`標記受阻：${task.blockReason}`);
      } else if (cmd.type === "unblock") {
        if (!can(user, "update_task", site)) return { ok: false, error: "冇權限" };
        task.blocked = false;
        task.blockReason = "";
        push("解除受阻");
      }
      task.updatedAt = stamp;
      saveStore();
      void cloudWrite(["companies", task.companyId, "sites", task.siteId, "tasks", task.id], task);
      return { ok: true, warning };
    }

    function go(path) {
      currentPath = path.startsWith("/") ? path : `/${path}`;

      runtime.modal = null;
      try { if (location.hash !== `#${currentPath}`) location.hash = `#${currentPath}`; } catch {}
      render();

      } catch {}
    });

        return `<p class="bg-navy px-4 py-2 text-center text-xs leading-5 text-gold" data-testid="cloud-banner">已連接 Firebase（${esc(getSavedFbConfig().projectId || "renocamp-site")}）· 雲端帳戶：${esc(runtime.cloudEmail || "已登入")} · 資料即時同步並按公司隔離</p>`;
      }
      return `<p class="bg-navy px-4 py-2 text-center text-xs leading-5 text-paper" data-testid="demo-banner">${esc(DEMO_NOTE)}</p>`;
    }
    function brandMark(size = "md") {
      const s = size === "lg" ? "size-14" : size === "sm" ? "size-9" : "size-11";
      return `<span class="grid ${s} shrink-0 overflow-hidden rounded-full ring-2 ring-gold">${imgTag("/photos/mascot.jpg", "地盤通師傅仔", "size-full scale-105 object-cover")}</span>`;
    }
    function loopRailHtml(kicker, items) {
      const firstFail = items.findIndex((x) => !x.pass);
      const steps = items.map((x, i) => ({ ...x, state: firstFail === -1 || i < firstFail ? "done" : i === firstFail ? "now" : "wait" }));
      const cur = steps.find((s) => s.state === "now");
      return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card" data-testid="loop-rail">
        <p class="text-xs font-bold text-gold-2">今日閉環</p><p class="text-xl font-black">${esc(kicker)}</p>
        <ol class="mt-3">${steps.map((step, i) => {
          const cls = step.state === "done" ? "bg-navy text-paper" : step.state === "now" ? "bg-gold text-ink" : "bg-paper-2 text-muted";
          return `<li class="flex gap-3"><div class="flex flex-col items-center"><span class="grid size-8 shrink-0 place-items-center rounded-full text-xs font-black ${cls}">${step.state === "done" ? "✓" : i + 1}</span>${i < steps.length - 1 ? `<span class="min-h-4 w-0.5 flex-1 ${step.state === "done" ? "bg-navy" : "bg-line"}"></span>` : ""}</div><div class="pb-3"><p class="text-sm font-bold ${step.state === "wait" ? "text-muted" : ""}">${esc(step.label)}</p><p class="text-xs text-muted">${esc(step.hint)}</p></div></li>`;
        }).join("")}</ol>
        <p class="text-sm font-bold">${cur ? `而家做：${esc(cur.label)}` : "今日呢圈埋咗口。"}</p>
      </div>`;
    }
    function deniedHtml() {
      return `<div class="rounded-3xl border border-line bg-card p-6 shadow-card"><h1 class="text-2xl font-black">呢度你入唔到</h1><p class="mt-2 text-sm text-muted">你嘅身份只可以睇獲分派嘅工作。前端藏起個掣唔算安全，所以呢頁自己都會拒絕。</p></div>`;
    }

      } else if (m.type === "task") {

            <article class="rounded-3xl border border-leaf/40 bg-leaf-soft p-4"><p class="text-xs font-bold text-muted">已提交日誌</p><p class="mt-1 text-3xl font-black tabular-nums text-leaf">${submitted}</p></article>
            <article class="rounded-3xl border border-line bg-ice p-4"><p class="text-xs font-bold text-muted">登記人手</p><p class="mt-1 text-3xl font-black tabular-nums text-gold-2">${crew}</p></article>
          </section>
          <section id="access" class="rounded-3xl bg-navy p-5 text-card"><h2 class="text-2xl font-black text-gold">邊個睇到咩，分得清。</h2><p class="mt-2 text-sm leading-6 text-card/85">公司管理員睇晒自己公司。項目經理跟進度。工地主管只睇自己負責嘅盤。分判只睇獲分派嘅工作，入唔到成間公司。平台管理員只管客戶同訂閱，唔翻工地日誌。</p></section>
          <section id="pricing" class="space-y-3">

            <p class="text-sm font-medium text-clay">${esc(PRICE_NOTE)}</p>
          </section>
        </main>
      </div>`;

    function renderLogin() {
      const fbCfg = getSavedFbConfig();
      const groups = [
        { title: "平台", ids: ["u-ops"] },
        { title: "裕安室內工程", ids: ["u-y-admin", "u-y-pm", "u-y-sup", "u-y-sup2", "u-y-elec", "u-y-wood"] },
        { title: "澄木設計工程", ids: ["u-c-admin"] },
      ];
      return `<div class="min-h-dvh bg-paper pb-12">
        ${bannerHtml()}
        <main class="mx-auto max-w-3xl space-y-5 px-4 py-6">
          <a href="#/" class="inline-flex items-center gap-2">${brandMark("sm")}<span class="text-lg font-black">地盤通</span></a>
          <figure class="overflow-hidden rounded-3xl shadow-card">${imgTag("/photos/crew-depart.jpg", "一齊出發去裝修", "h-44 w-full object-cover object-[center_40%]")}<figcaption class="bg-navy px-4 py-2.5 text-sm font-bold text-card">一齊出發去裝修 · 由站口行去屋苑</figcaption></figure>
          <section class="rounded-3xl border border-line bg-card p-5 shadow-card space-y-3">
            <h1 class="text-2xl font-black">正式雲端登入（Firebase）</h1>
            <p class="text-sm text-muted">專案：${esc(fbCfg.projectId)}。${hasFbConfig(fbCfg) ? "已就緒，請輸入電郵密碼登入。" : "未填 apiKey（可先用陳志遠入 Firebase 設定貼入 apiKey）。"}</p>
            <div id="cloud-login-err" class="hidden rounded-2xl bg-clay-soft px-4 py-3 text-sm text-clay"></div>
            <input id="cloud-email" type="email" placeholder="電郵（例如 info@pbc.ltd）" class="min-h-11 w-full rounded-2xl border border-line px-3 text-sm" />
            <input id="cloud-pass" type="password" placeholder="密碼" class="min-h-11 w-full rounded-2xl border border-line px-3 text-sm" />
            <button type="button" id="cloud-login-btn" class="inline-flex min-h-11 items-center rounded-full bg-gold px-5 text-sm font-black text-ink">用 Firebase 登入</button>
          </section>
          <h2 class="text-2xl font-black">示範身份一鍵試用</h2>
          ${groups.map((g) => `<section class="space-y-2"><h3 class="text-lg font-black">${g.title}</h3><div class="grid gap-2">${g.ids.map((id) => {
            const m = state.members.find((x) => x.id === id);
            if (!m) return "";
            const comp = state.companies.find((c) => c.id === m.companyId);
            return `<button type="button" data-login="${m.id}" ${m.disabled ? "disabled" : ""} class="flex min-h-16 items-center gap-3 rounded-3xl border border-line bg-card p-4 text-left shadow-card disabled:opacity-50"><span class="grid size-10 shrink-0 place-items-center rounded-full bg-navy text-sm font-black text-card ring-2 ring-gold">${esc(comp?.mark ?? "台")}</span><span><span class="block font-bold">${esc(m.name)}${m.disabled ? "（已停用）" : ""}</span><span class="block text-xs text-muted">${esc(ROLE_LABEL[m.role])} · ${esc(m.blurb)}</span></span></button>`;
          }).join("")}</div></section>`).join("")}
        </main>
      </div>`;
    }

    function renderAppShell(path, contentHtml) {
      const { user, company, tasks } = getScope();
      if (!user) { go("/login"); return ""; }
      const flags = state.featureFlags ?? DEFAULT_FEATURE_FLAGS;
      const isPlatform = user.role === "platform_admin";
      const mainNav = isPlatform ? [] : [{ to: "/app", label: "總覽" }, { to: "/app/sites", label: "工地" }, ...(flags.tasks ? [{ to: "/app/tasks", label: "任務" }] : []), ...(flags.logs ? [{ to: "/app/logs", label: "紀錄" }] : [])];
      const moreNav = isPlatform
        ? [{ to: "/app/admin", label: "客戶公司" }, { to: "/app/billing", label: "套餐說明" }, { to: "/app/account", label: "帳戶" }]
        : [...(user.role !== "subcontractor" ? [{ to: "/app/people", label: "人手／分判" }] : []), ...(flags.materials ? [{ to: "/app/materials", label: "材料" }] : []), ...(flags.files ? [{ to: "/app/files", label: "文件／相片" }] : []), ...(user.role !== "subcontractor" && flags.reports ? [{ to: "/app/reports", label: "報表" }] : []), ...(flags.billing && user.role !== "subcontractor" ? [{ to: "/app/billing", label: "套餐" }] : []), { to: "/app/account", label: "帳戶" }];
      const today = todayISO();
      const open = tasks.filter((t) => t.status !== "done" && (t.due <= today || isOverdue(t, today))).length;
      const isAct = (to) => (to === "/app" ? path === "/app" || path === "/app/" : path === to || path.startsWith(to + "/"));

      return `<div class="min-h-dvh bg-paper">
        <aside class="fixed inset-y-0 left-0 z-30 hidden w-60 flex-col bg-navy md:flex">
          <a href="#${isPlatform ? "/app/admin" : "/app"}" class="flex items-center gap-3 px-4 py-5">${brandMark("md")}<span><span class="block text-lg font-black leading-none text-card">地盤通</span><span class="text-xs text-card/70">工地管理</span></span></a>
          <nav class="flex flex-1 flex-col gap-1 px-3">${[...mainNav, ...moreNav].map((i) => `<a href="#${i.to}" class="flex min-h-11 items-center rounded-2xl px-3 text-sm font-bold ${isAct(i.to) ? "bg-gold text-ink" : "text-card/80"}">${i.label}</a>`).join("")}</nav>
        </aside>
        <div class="md:pl-60">
          <header class="sticky top-0 z-20 border-b border-line bg-paper/95 backdrop-blur">
            ${bannerHtml()}
            <div class="flex items-center gap-3 px-4 py-3">
              <span class="grid size-11 shrink-0 place-items-center rounded-full bg-navy text-sm font-black text-card ring-2 ring-gold">${esc(company?.mark ?? "地")}</span>
              <div class="min-w-0 flex-1"><p class="truncate text-sm font-bold">${esc(company?.shortName ?? "地盤通平台")}</p><p class="truncate text-xs text-muted">${esc(ROLE_LABEL[user.role])} · ${esc(user.name)}</p></div>
            </div>
            ${!isPlatform ? `<div class="px-4 pb-3"><figure class="overflow-hidden rounded-3xl shadow-card">${imgTag("/photos/crew-depart.jpg", "一齊出發去裝修", "h-28 w-full object-cover object-[center_40%]")}<figcaption class="bg-navy px-4 py-2.5 text-sm font-bold text-card">一齊出發 · 今日仲有 <span class="tabular-nums text-gold">${open}</span> 樣未搞掂</figcaption></figure></div>` : ""}
          </header>
          <main class="px-4 pb-28 pt-4 md:px-8 md:pb-12">${contentHtml}</main>
        </div>
        <nav class="fixed inset-x-0 bottom-0 z-40 bg-navy md:hidden">
          <div class="grid ${isPlatform ? "grid-cols-3" : "grid-cols-5"} gap-1 px-1 py-2">
            ${isPlatform ? moreNav.map((i) => `<a href="#${i.to}" class="flex min-h-12 items-center justify-center rounded-2xl text-xs font-bold ${isAct(i.to) ? "bg-gold text-ink" : "text-card"}">${i.label}</a>`).join("") : `${mainNav.map((i) => `<a href="#${i.to}" class="flex min-h-12 items-center justify-center rounded-2xl text-xs font-bold ${isAct(i.to) ? "bg-gold text-ink" : "text-card"}">${i.label}</a>`).join("")}<button type="button" id="nav-more-btn" class="flex min-h-12 items-center justify-center rounded-2xl text-xs font-bold ${runtime.moreOpen ? "bg-gold text-ink" : "text-card"}">更多</button>`}
          </div>
        </nav>
        ${runtime.moreOpen ? `<div class="fixed inset-0 z-50 md:hidden"><button type="button" id="close-more-bg" class="absolute inset-0 bg-navy/50"></button><div class="absolute inset-x-0 bottom-0 rounded-t-3xl bg-card p-4 pb-8"><div class="mb-3 flex items-center justify-between"><h2 class="text-xl font-black">更多</h2><button type="button" id="close-more-x" class="rounded-full bg-paper-2 px-3 py-1.5 text-sm font-bold">關閉</button></div><div class="grid grid-cols-2 gap-2">${moreNav.map((i) => `<a href="#${i.to}" class="flex min-h-12 items-center justify-center rounded-2xl border border-line px-3 text-sm font-bold">${i.label}</a>`).join("")}</div></div></div>` : ""}
        ${renderModal()}
      </div>`;
    }

    function renderOverview() {
      const { user, sites, tasks, logs, materials, checkins, nudges, dayCloses, instructions } = getScope();
      if (user.role === "platform_admin") { go("/app/admin"); return ""; }
      const today = todayISO(), soon2 = isoOffset(2);
      const dueSoon = tasks.filter((t) => t.status !== "done" && t.due > today && t.due <= soon2);
      const matSoon = materials.filter((m) => m.status !== "delivered" && m.neededBy > today && m.neededBy <= soon2);
      const canLog = sites.some((s) => can(user, "create_log", s));
      const canMat = sites.some((s) => can(user, "create_material", s));

      let loopSection = "";
      if (user.role === "subcontractor") {
        const mineToday = checkins.filter((r) => r.memberId === user.id && r.date === today);
        const rep = (sid) => mineToday.find((r) => r.siteId === sid);
        const allRep = sites.length === 0 || sites.every((s) => rep(s.id));
        const allFin = sites.length > 0 && sites.every((s) => { const r = rep(s.id); return r && (r.absent || r.leftAt); });
        const fresh = tasks.filter((t) => t.status === "pending" || t.status === "unassigned");
        const doing = tasks.filter((t) => t.status === "in_progress");
        const waiting = tasks.filter((t) => t.status === "review");
        const myCalls = materials.filter((m) => m.note.startsWith(`工人叫料：${user.name}`) && m.status !== "delivered");
        loopSection = `
          ${loopRailHtml("工人一日", [
            { label: "到場", hint: allRep ? "每個盤都報過到或話咗去唔到" : "仲有盤未報到", pass: allRep },
            { label: "開工", hint: fresh.length ? `仲有 ${fresh.length} 張未開始` : "未開始嘅單已清空", pass: fresh.length === 0 },
            { label: "做完交相", hint: doing.length ? `${doing.length} 張做緊／要改` : "冇單留喺你手", pass: doing.length === 0 },
            { label: "等主管收", hint: waiting.length ? `${waiting.length} 張等驗收` : "冇單卡喺驗收", pass: waiting.length === 0 },
            { label: "收工", hint: allFin ? "每個盤都收工或去唔到" : "做完記得撳收工", pass: sites.length === 0 || allFin },
          ])}
          ${sites.map((s) => {
            const mine = rep(s.id);
            const st = mine?.absent ? "今日去唔到" : mine && !mine.leftAt ? "已到場" : mine ? "今日已收工" : "未報到";
            return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><p class="font-bold">${esc(s.name)}</p><p class="text-xs text-muted">${st}${mine?.note ? ` · ${esc(mine.note)}` : ""}</p><div class="grid grid-cols-3 gap-2"><button type="button" data-arrive="${s.id}" class="min-h-11 rounded-full bg-navy px-3 text-xs font-bold text-paper">我到場</button><button type="button" data-leave="${s.id}" class="min-h-11 rounded-full bg-paper-2 px-3 text-xs font-bold">我收工</button><button type="button" data-absent="${s.id}" class="min-h-11 rounded-full border border-line px-3 text-xs font-bold">今日去唔到</button></div></div>`;
          }).join("")}
          ${myCalls.length ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><h3 class="font-bold">你叫過嘅料</h3>${myCalls.map((m) => `<div class="flex items-center justify-between text-sm"><span>${esc(m.name)} · ${esc(m.qty)} · ${MATERIAL_LABEL[m.status]}</span>${m.status === "ordered" ? `<button type="button" data-confirm-mat="${m.id}" class="rounded-full bg-gold px-3 py-1 text-xs font-bold text-ink">我收到</button>` : ""}</div>`).join("")}</div>` : ""}
          <button type="button" data-open-modal="workerMat" class="min-h-11 rounded-full bg-gold px-5 text-sm font-black text-ink">叫料</button>`;
      } else {
        const selfRun = user.role === "company_admin" && sites.length > 0 && sites.every((s) => s.supervisorId === user.id);
        const missing = sites.filter((s) => logState(logs, s.id, today) !== "submitted");
        const reviews = tasks.filter((t) => t.status === "review");
        const pendingNotes = instructions.filter((r) => !r.ackAt);
        const closedCount = sites.filter((s) => dayCloses.some((r) => r.siteId === s.id && r.date === today)).length;
        const loose = tasks.filter((t) => t.status === "unassigned");
        const steps = selfRun
          ? [{ label: "自己交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "你管嘅盤都交咗", pass: missing.length === 0 }, { label: "驗收", hint: reviews.length ? `${reviews.length} 張等你收` : "冇單等驗收", pass: reviews.length === 0 }, { label: "等自己回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "冇指示吊住", pass: pendingNotes.length === 0 }, { label: "收工", hint: `收咗 ${closedCount}/${sites.length} 個盤`, pass: sites.length > 0 && closedCount === sites.length }]
          : user.role === "site_supervisor"
          ? [{ label: "點人", hint: checkins.some((r) => r.date === today) || logs.some((r) => r.date === today) ? "今日有人報到或已開日誌" : "未有人報到", pass: checkins.some((r) => r.date === today) || logs.some((r) => r.date === today) }, { label: "交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "你管嘅盤都交咗", pass: missing.length === 0 }, { label: "分派", hint: loose.length ? `${loose.length} 張未分派` : "張張有人跟", pass: loose.length === 0 }, { label: "驗收", hint: reviews.length ? `${reviews.length} 張等你收` : "冇單等驗收", pass: reviews.length === 0 }, { label: "回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "指示都回過", pass: pendingNotes.length === 0 }, { label: "收工", hint: `收咗 ${closedCount}/${sites.length} 個盤`, pass: sites.length > 0 && closedCount === sites.length }]
          : [{ label: user.role === "project_manager" ? "睇邊個拖" : "數未交日誌", hint: missing.length ? `${missing.length} 個盤未交` : "日誌齊", pass: missing.length === 0 }, { label: "催主管", hint: missing.length ? "未交嘅盤可催主管" : "唔使催", pass: missing.length === 0 || missing.every((s) => nudges.some((n) => n.siteId === s.id && n.date === today && !n.resolvedAt)) }, { label: "等現場回指示", hint: pendingNotes.length ? `${pendingNotes.length} 句未回` : "指示都有人回", pass: pendingNotes.length === 0 }, { label: "等各盤收工", hint: `${closedCount}/${sites.length} 個盤收咗工`, pass: sites.length > 0 && closedCount === sites.length }];
        loopSection = `
          ${loopRailHtml(selfRun ? "老闆兼主管" : user.role === "company_admin" ? "老闆一日" : user.role === "project_manager" ? "經理一日" : "主管一日", steps)}
          <div class="space-y-3">${sites.map((s) => {
            const lg = logState(logs, s.id, today);
            const cl = dayCloses.find((r) => r.siteId === s.id && r.date === today);
            const pIns = instructions.filter((r) => r.siteId === s.id && !r.ackAt);
            const rev = tasks.find((t) => t.siteId === s.id && t.status === "review");
            return `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2">
              <div class="flex justify-between"><div><p class="font-bold">${esc(s.name)}</p><p class="text-xs text-muted">${esc(s.district)} · 進度 ${siteProgress(s)}%</p></div><span class="rounded-full px-2.5 py-1 text-xs font-bold h-fit ${lg === "submitted" ? "bg-navy text-paper" : "bg-gold/30 text-ink"}">${LOG_STATE_LABEL[lg]}</span></div>
              ${pIns.map((ins) => `<div class="rounded-2xl bg-paper-2 p-2.5 text-xs flex items-center justify-between gap-2"><span>${esc(ins.byName)}：${esc(ins.text)}</span><button type="button" data-ack-ins="${ins.id}" class="rounded-full bg-card px-2.5 py-1 font-bold border border-line">收到</button></div>`).join("")}
              ${cl ? `<p class="text-xs text-leaf font-bold">已收工 · ${esc(cl.byName)}：${esc(cl.note)}</p>` : ""}
              <div class="flex flex-wrap gap-2">
                ${lg !== "submitted" ? `<button type="button" data-open-log="${s.id}" class="min-h-10 rounded-full bg-navy px-3 text-xs font-bold text-paper">寫今日日誌</button>` : ""}
                ${rev ? `<button type="button" data-open-task="${rev.id}" class="min-h-10 rounded-full bg-gold px-3 text-xs font-black text-ink">去驗收</button>` : ""}
                ${can(user, "nudge_log", s) && lg !== "submitted" ? `<button type="button" data-nudge="${s.id}" class="min-h-10 rounded-full border border-line px-3 text-xs font-bold">催交</button>` : ""}
                ${can(user, "instruct", s) ? `<button type="button" data-instruct="${s.id}" class="min-h-10 rounded-full bg-paper-2 px-3 text-xs font-bold">落指示</button>` : ""}
                ${can(user, "close_day", s) ? `<button type="button" data-close-day="${s.id}" class="min-h-10 rounded-full bg-paper-2 px-3 text-xs font-bold">${cl ? "改收工交帶" : "今日收工"}</button>` : ""}
              </div>
            </div>`;
          }).join("")}</div>`;
      }

      return `<div class="space-y-4">
        <div><p class="text-sm font-bold text-muted">${formatDate(today)} 星期${weekday(today)}</p><h1 class="text-3xl font-black">${esc(user.name)}，今日有咩要跟？</h1></div>
        ${loopSection}
        <div class="grid grid-cols-2 gap-2 md:grid-cols-4">
          ${canLog ? `<button type="button" data-open-modal="log" class="min-h-11 rounded-full bg-navy px-3 text-sm font-bold text-paper">寫每日紀錄</button>` : ""}
          <button type="button" data-open-modal="task" class="min-h-11 rounded-full bg-gold px-3 text-sm font-black text-ink">開任務</button>
          <button type="button" data-open-modal="snag" class="min-h-11 rounded-full border border-line bg-card px-3 text-sm font-bold">報問題</button>
          ${canMat ? `<button type="button" data-open-modal="material" class="min-h-11 rounded-full bg-paper-2 px-3 text-sm font-bold">材料跟進</button>` : ""}
        </div>
        ${dueSoon.length + matSoon.length > 0 ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-1"><h3 class="font-bold">兩日內要跟</h3>${dueSoon.map((t) => `<p class="text-sm">${esc(t.title)} · ${t.due.slice(5)}</p>`).join("")}${matSoon.map((m) => `<p class="text-sm text-muted">料 · ${esc(m.name)} · ${m.neededBy.slice(5)}</p>`).join("")}</div>` : ""}
        <section class="space-y-3"><h2 class="text-2xl font-black">各工地進度</h2><div class="grid gap-3 md:grid-cols-2">${sites.map((s) => `<a href="#/app/sites/${s.id}" class="overflow-hidden rounded-3xl border border-line bg-card shadow-card block">${imgTag(s.cover, s.name, "h-32 w-full object-cover")}<div class="p-4 space-y-1"><p class="text-xs text-muted">${esc(s.district)} · ${esc(s.stage)}</p><p class="font-bold">${esc(s.name)}</p><div class="flex items-center gap-3"><div class="h-2 flex-1 overflow-hidden rounded-full bg-paper-2"><div class="h-full bg-navy" style="width:${siteProgress(s)}%"></div></div><span class="text-sm tabular-nums">${siteProgress(s)}%</span></div></div></a>`).join("")}</div></section>
      </div>`;
    }

    function renderSites() {
      const { user, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      return `<div class="space-y-4">
        <div class="flex items-end justify-between"><h1 class="text-3xl font-black">工地</h1>${can(user, "create_site") ? `<button type="button" data-open-modal="site" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">開工地</button>` : ""}</div>
        <div class="grid gap-3 md:grid-cols-2">${sites.map((s) => `<a href="#/app/sites/${s.id}" class="overflow-hidden rounded-3xl border border-line bg-card shadow-card block">${imgTag(s.cover, s.name, "h-40 w-full object-cover")}<div class="p-4 space-y-1"><p class="text-xs text-muted">${esc(s.district)} · ${esc(s.stage)}</p><p class="font-bold">${esc(s.name)}</p><p class="text-sm text-muted">${esc(s.client)} · 目標 ${formatDate(s.targetDate)}</p></div></a>`).join("")}</div>
      </div>`;
    }

    function renderSiteDetail(siteId) {
      const { user, logs, tasks, materials, files, people } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      const site = state.sites.find((s) => s.id === siteId);
      if (!site || !canSeeSite(user, site)) return deniedHtml();
      const siteLogs = logs.filter((l) => l.siteId === site.id), siteTasks = tasks.filter((t) => t.siteId === site.id), siteMats = materials.filter((m) => m.siteId === site.id), siteFiles = files.filter((f) => f.siteId === site.id);
      const tab = runtime.siteTab, editable = can(user, "edit_site", site), subs = people.filter((p) => p.role === "subcontractor");
      return `<div class="space-y-4">
        ${imgTag(site.cover, site.name, "h-44 w-full rounded-3xl object-cover")}
        <div><p class="text-sm text-muted">${esc(site.district)} · ${esc(site.stage)}</p><h1 class="text-3xl font-black">${esc(site.name)}</h1></div>
        <div class="flex gap-2 overflow-x-auto">${[["overview", "概覽"], ["progress", "進度"], ["logs", "紀錄"], ["resources", "資源"], ["files", "文件"]].map(([id, lb]) => `<button type="button" data-site-tab="${id}" class="min-h-11 shrink-0 rounded-full px-4 text-sm font-bold ${tab === id ? "bg-navy text-paper" : "border border-line bg-card"}">${lb}</button>`).join("")}</div>
        ${tab === "overview" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card grid gap-2 text-sm md:grid-cols-2"><div><span class="text-muted">地址：</span>${esc(site.address)}</div><div><span class="text-muted">客戶：</span>${esc(site.client)}</div><div><span class="text-muted">工地主管：</span>${esc(memberName(state.members, site.supervisorId))}</div><div><span class="text-muted">目標完工：</span>${formatDate(site.targetDate)}</div></div>` : ""}
        ${tab === "progress" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3">${site.trades.map((t, idx) => `<div><div class="flex justify-between text-sm"><span>${esc(t.name)}</span><span class="tabular-nums">${t.progress}%</span></div><div class="mt-1 h-2 overflow-hidden rounded-full bg-paper-2"><div class="h-full bg-navy" style="width:${t.progress}%"></div></div>${editable ? `<input type="range" min="0" max="100" value="${t.progress}" data-trade-site="${site.id}" data-trade-idx="${idx}" class="mt-1 w-full" />` : ""}</div>`).join("")}</div>` : ""}
        ${tab === "logs" ? (user.role === "subcontractor"
          ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="font-bold">今日${LOG_STATE_LABEL[logState(siteLogs, site.id, todayISO())]}</p><p class="mt-1 text-sm text-muted">正式日誌由主管寫。你只睇到今日開唔開工，睇唔到日誌內文。</p></div>`
          : `<div class="space-y-3">${can(user, "create_log", site) ? `<button type="button" data-open-log="${site.id}" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">寫今日紀錄</button>` : ""}${siteLogs.map((l) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><div class="flex justify-between"><p class="font-bold">${formatDate(l.date)} · ${esc(l.weather)}</p><span class="text-xs font-bold">${l.status === "draft" ? "草稿" : "已提交"}</span></div><p class="mt-1 text-sm">${l.noWork ? "今日無施工" : esc(l.work)}</p><p class="mt-1 text-xs text-muted">填寫人 ${esc(l.authorName)}</p></div>`).join("") || `<p class="text-sm text-muted">未有日誌。</p>`}</div>`) : ""}
        ${tab === "resources" ? `<div class="space-y-3">
          ${can(user, "assign_sub", site) ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><h2 class="font-bold">分判派場</h2>${subs.map((p) => { const on = site.assignedSubIds.includes(p.id); return `<div class="flex items-center justify-between text-sm"><span>${esc(p.name)} · ${esc(p.trade || "")}</span><button type="button" data-toggle-sub-site="${site.id}" data-toggle-sub-id="${p.id}" class="min-h-9 rounded-full px-3 text-xs font-bold ${on ? "bg-paper-2" : "border border-line"}">${on ? "已派" : "派入場"}</button></div>`; }).join("")}</div>` : ""}
          <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><div class="flex justify-between items-center"><h2 class="font-bold">任務（${siteTasks.length}）</h2><button type="button" data-open-site-task="${site.id}" class="text-xs font-bold text-navy underline">＋ 開任務</button></div>${siteTasks.map((t) => `<button type="button" data-open-task="${t.id}" class="flex w-full justify-between rounded-2xl border border-line px-3 py-2 text-left text-sm"><span>${esc(t.title)}</span><span class="text-xs font-bold">${STATUS_LABEL[t.status]}</span></button>`).join("") || `<p class="text-sm text-muted">未有任務。</p>`}</div>
          <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-1"><h2 class="font-bold">材料（${siteMats.length}）</h2>${siteMats.map((m) => `<p class="text-sm">${esc(m.name)} · ${esc(m.qty)} · ${MATERIAL_LABEL[m.status]}</p>`).join("") || `<p class="text-sm text-muted">未有材料。</p>`}</div>
        </div>` : ""}
        ${tab === "files" ? `<div class="grid gap-3 sm:grid-cols-2">${siteFiles.map((f) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card">${f.src ? imgTag(f.src, f.name, "mb-2 h-32 w-full rounded-2xl object-cover") : ""}<p class="font-bold">${esc(f.name)}</p><p class="text-xs text-muted">${esc(f.note)}</p></div>`).join("") || `<p class="text-sm text-muted">未有檔案。</p>`}</div>` : ""}
      </div>`;
    }

    function renderTasks() {
      const { user, tasks, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      const filters = ["全部", "今日", "逾期", "要改", "待驗收", "受阻", "執漏"], today = todayISO();
      const rows = tasks.filter((t) => {
        if (runtime.taskFilter === "今日") return t.due === today && t.status !== "done";
        if (runtime.taskFilter === "逾期") return isOverdue(t, today);
        if (runtime.taskFilter === "要改") return Boolean(t.needsRework) && t.status !== "done";
        if (runtime.taskFilter === "待驗收") return t.status === "review";
        if (runtime.taskFilter === "受阻") return t.blocked;
        if (runtime.taskFilter === "執漏") return t.kind === "snag";
        return true;
      });
      return `<div class="space-y-4">
        <div class="flex items-end justify-between gap-2"><h1 class="text-3xl font-black">任務／執漏</h1><div class="flex gap-2"><button type="button" data-open-modal="snag" class="min-h-11 rounded-full border border-line bg-card px-4 text-sm font-bold">執漏</button><button type="button" data-open-modal="task" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">開任務</button></div></div>
        <div class="flex gap-2 overflow-x-auto">${filters.map((f) => `<button type="button" data-task-filter="${f}" class="min-h-11 shrink-0 rounded-full px-4 text-sm font-bold ${runtime.taskFilter === f ? "bg-navy text-paper" : "border border-line bg-card"}">${f}</button>`).join("")}</div>
        <div class="space-y-2">${rows.map((t) => `<button type="button" data-open-task="${t.id}" class="w-full rounded-3xl border border-line bg-card p-4 text-left shadow-card">
          <div class="flex flex-wrap gap-1.5 text-xs font-bold"><span class="rounded-full bg-paper-2 px-2.5 py-1">${STATUS_LABEL[t.status]}</span>${t.blocked ? `<span class="rounded-full bg-clay-soft px-2.5 py-1 text-clay">受阻</span>` : ""}${t.needsRework ? `<span class="rounded-full bg-clay-soft px-2.5 py-1 text-clay">要改</span>` : ""}</div>
          <p class="mt-2 font-bold">${esc(t.title)}</p>
          <p class="text-xs text-muted">${esc(sites.find((s) => s.id === t.siteId)?.name ?? "")} · ${PRIORITY_LABEL[t.priority]} · ${formatDate(t.due)}</p>
        </button>`).join("") || `<p class="text-sm text-muted">呢個篩選下面暫時冇單。</p>`}</div>
      </div>`;
    }

    function renderLogs() {
      const { user, logs, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      const today = todayISO();
      if (user.role === "subcontractor") {
        return `<div class="space-y-4"><h1 class="text-3xl font-black">每日紀錄</h1><p class="text-sm text-muted">正式日誌由主管寫。你只睇到今日開唔開工，睇唔到成份紀錄。</p>${sites.map((s) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="font-bold">${esc(s.name)}</p><p class="text-sm text-muted">今日${LOG_STATE_LABEL[logState(logs, s.id, today)]}</p></div>`).join("")}</div>`;
      }
      return `<div class="space-y-4">
        <div class="flex items-end justify-between"><h1 class="text-3xl font-black">每日紀錄</h1><button type="button" data-open-modal="log" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">寫紀錄</button></div>
        ${logs.map((l) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-1">
          <div class="flex justify-between"><p class="text-xs text-muted">${esc(sites.find((x) => x.id === l.siteId)?.name ?? "")}</p><span class="rounded-full px-2.5 py-0.5 text-xs font-bold ${l.status === "draft" ? "bg-gold/30" : "bg-navy text-paper"}">${l.status === "draft" ? "草稿" : "已提交"}</span></div>
          <p class="font-bold">${formatDate(l.date)} 星期${weekday(l.date)} · ${esc(l.weather)}</p>
          <p class="text-sm">${l.noWork ? "今日無施工。" : esc(l.work)}</p>
          ${l.deliveries ? `<p class="text-xs text-muted">送貨：${esc(l.deliveries)}</p>` : ""}
          ${l.issues ? `<p class="text-xs text-clay">問題：${esc(l.issues)}</p>` : ""}
          ${l.headcount?.length ? `<p class="text-xs text-muted">人數：${l.headcount.map((h) => `${esc(h.trade)} ${h.count}`).join("、")}</p>` : ""}
          <p class="text-xs text-muted">填寫人 ${esc(l.authorName)}</p>
          ${(l.revisions || []).map((r) => `<p class="text-xs text-muted">${formatWhen(r.at)} · ${esc(r.byName)} · ${esc(r.note)}</p>`).join("")}
          <button type="button" data-edit-log="${l.id}" class="mt-2 min-h-9 rounded-full border border-line px-3 text-xs font-bold">修改</button>
        </div>`).join("")}
      </div>`;
    }

    function renderPeople() {
      const { user, people, sites } = getScope();
      if (!user || !can(user, "view_people")) return deniedHtml();
      return `<div class="space-y-4">
        <div class="flex items-end justify-between"><h1 class="text-3xl font-black">人手／分判</h1>${can(user, "manage_people") ? `<button type="button" data-open-modal="person" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">加人手</button>` : ""}</div>
        ${people.map((p) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card flex justify-between"><div><p class="font-bold">${esc(p.name)}</p><p class="text-xs text-muted">${ROLE_LABEL[p.role]} · ${esc(p.phone)}</p></div><span class="rounded-full bg-paper-2 px-3 py-1 text-xs font-bold h-fit">${sites.filter((s) => s.supervisorId === p.id || s.assignedSubIds.includes(p.id) || s.managerId === p.id).length} 個盤</span></div>`).join("")}
      </div>`;
    }

    function renderMaterials() {
      const { user, materials, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      const canEdit = sites.some((s) => can(user, "edit_material", s));
      return `<div class="space-y-4">
        <div class="flex items-end justify-between"><h1 class="text-3xl font-black">材料</h1>${canEdit ? `<button type="button" data-open-modal="material" class="min-h-11 rounded-full bg-navy px-4 text-sm font-bold text-paper">加跟進</button>` : `<button type="button" data-open-modal="workerMat" class="min-h-11 rounded-full bg-gold px-4 text-sm font-black text-ink">叫料</button>`}</div>
        ${materials.map((m) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2">
          <div class="flex justify-between"><div><p class="font-bold">${esc(m.name)}</p><p class="text-xs text-muted">${esc(sites.find((s) => s.id === m.siteId)?.name ?? "")} · ${esc(m.qty)} · 要喺 ${formatDate(m.neededBy)}</p>${m.note ? `<p class="mt-1 text-sm">${esc(m.note)}</p>` : ""}</div><span class="rounded-full bg-paper-2 px-2.5 py-1 text-xs font-bold h-fit">${MATERIAL_LABEL[m.status]}</span></div>
          ${canEdit ? `<select data-mat-status="${m.id}" class="min-h-10 w-full rounded-2xl border border-line px-3 text-sm">${Object.keys(MATERIAL_LABEL).map((k) => `<option value="${k}" ${m.status === k ? "selected" : ""}>${MATERIAL_LABEL[k]}</option>`).join("")}</select>` : m.note.startsWith(`工人叫料：${user.name}`) && m.status === "ordered" ? `<button type="button" data-confirm-mat="${m.id}" class="min-h-10 rounded-full bg-gold px-4 text-xs font-black text-ink">我收到</button>` : ""}
        </div>`).join("")}
      </div>`;
    }

    function renderFiles() {
      const { user, files, sites } = getScope();
      if (!user || user.role === "platform_admin") return deniedHtml();
      return `<div class="space-y-4"><h1 class="text-3xl font-black">文件／相片</h1><div class="grid gap-3 sm:grid-cols-2">${files.map((f) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card">${f.src ? imgTag(f.src, f.name, "mb-2 h-36 w-full rounded-2xl object-cover") : ""}<p class="font-bold">${esc(f.name)}</p><p class="text-xs text-muted">${esc(sites.find((s) => s.id === f.siteId)?.name ?? "")}</p></div>`).join("")}</div></div>`;
    }

    function renderReports() {
      const { user, sites, tasks, logs, checkins } = getScope();
      if (!user || !can(user, "view_reports")) return deniedHtml();
      const today = todayISO(), missing = sites.filter((s) => logState(logs, s.id, today) !== "submitted"), waiting = tasks.filter((t) => t.status === "review"), loose = tasks.filter((t) => t.status === "unassigned"), away = checkins.filter((r) => r.date === today && r.absent);
      return `<div class="space-y-4"><h1 class="text-3xl font-black">報表</h1><div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-1"><h2 class="text-xl font-black">今日未埋口</h2><p class="text-sm">未交日誌 ${missing.length} 個盤${missing.length ? `：${missing.map((s) => esc(s.name)).join("、")}` : ""}</p><p class="text-sm">等驗收 ${waiting.length} 張 · 未分派 ${loose.length} 張</p><p class="text-sm">${away.length ? `今日去唔到：${away.map((r) => esc(r.memberName)).join("、")}` : "今日未有人話去唔到。"}</p></div></div>`;
    }

    function renderBilling() {
      const { user, company } = getScope();
      if (!user || !can(user, "view_billing")) return deniedHtml();
      return `<div class="space-y-4"><h1 class="text-3xl font-black">套餐</h1><p class="text-sm text-muted">${esc(PRICE_NOTE)}</p>${company ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><p class="text-xs text-gold-2">而家用緊</p><h2 class="text-2xl font-black">${PLANS[company.plan].name}</h2><p class="text-xs text-muted mt-1">付款狀態、套餐同用量只可以由後端更新。呢頁改唔到數。</p></div>` : ""}<div class="grid gap-3 md:grid-cols-3">${PLAN_ORDER.map((id) => `<div class="rounded-3xl border border-line bg-card p-4 shadow-card"><h3 class="text-xl font-black">${PLANS[id].name}</h3><p class="text-3xl font-black tabular-nums">HK$${PLANS[id].price}</p><p class="text-xs text-muted">${PLANS[id].sites} 個工地 · ${PLANS[id].seats} 個帳戶 · ${PLANS[id].gb} GB</p></div>`).join("")}</div></div>`;
    }

    function renderAccount() {
      const { user, company } = getScope();
      return `<div class="space-y-4"><h1 class="text-3xl font-black">帳戶</h1><div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-1"><p class="font-bold">${esc(user.name)}</p><p class="text-sm text-muted">${ROLE_LABEL[user.role]} · ${esc(company?.name ?? "平台")}</p></div><div class="rounded-3xl border border-line bg-card p-4 shadow-card text-sm">${runtime.authMode === "firebase" ? `已透過 Firebase Authentication（${esc(runtime.cloudEmail || "")}）驗證身份，權限由 Firestore 同 Storage 安全規則喺雲端強制執行。` : esc(SECURITY_NOTE)}</div><div class="flex flex-wrap gap-2"><a href="#/login" class="inline-flex min-h-11 items-center rounded-full border border-line bg-card px-4 text-sm font-bold">換個身份試</a><button type="button" id="btn-signout" class="min-h-11 rounded-full border border-line bg-card px-4 text-sm font-bold">登出</button><button type="button" id="btn-reset-demo" class="min-h-11 rounded-full bg-paper-2 px-4 text-sm font-bold">重設示範資料</button></div></div>`;
    }

    function renderAdmin() {
      const user = getUser();
      if (!user || !can(user, "view_admin")) return deniedHtml();
      const flags = state.featureFlags ?? DEFAULT_FEATURE_FLAGS;
      const cat = state.catalog ?? DEFAULT_CATALOG;
      const ghSaved = (() => { try { return JSON.parse(safeGet(GH_DEPLOY_KEY) || "{}"); } catch { return {}; } })();
      const fbCfg = getSavedFbConfig();
      const tab = runtime.adminTab;
      const tabs = [["features", "功能開關"], ["members", "全平台成員"], ["catalog", "常用選項"], ["deploy", "一鍵部署 GitHub"], ["firebase", "Firebase 設定"]];
      return `<div class="space-y-4">
        <div><h1 class="text-3xl font-black">客戶公司 · 超級管理員控制台</h1><p class="text-sm text-muted">管理全站功能開關、跨公司成員、常用選項、一鍵推送 index.html 到 GitHub 同 Firebase 接駁（仍保持工地日誌隔離）。</p></div>
        <div class="flex flex-wrap gap-2">${tabs.map(([id, lb]) => `<button type="button" data-admin-tab="${id}" class="min-h-11 rounded-full px-4 text-sm font-bold ${tab === id ? "bg-navy text-paper" : "border border-line bg-card"}">${lb}</button>`).join("")}</div>
        ${tab === "features" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-2"><h2 class="text-xl font-black">網頁功能開關</h2>${Object.keys(FEATURE_LABELS).map((k) => { const on = flags[k] ?? true; return `<div class="flex items-center justify-between gap-3 rounded-2xl bg-paper-2 p-3"><div><p class="font-bold">${FEATURE_LABELS[k].label}</p><p class="text-xs text-muted">${FEATURE_LABELS[k].hint}</p></div><button type="button" data-flag="${k}" class="min-h-11 rounded-full px-4 text-sm font-bold ${on ? "bg-navy text-paper" : "border border-line bg-card"}">${on ? "已開啟" : "已關閉"}</button></div>`; }).join("")}</div>` : ""}
        ${tab === "members" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3"><h2 class="text-xl font-black">全平台成員（${state.members.length}）</h2>${state.members.map((m) => { const comp = state.companies.find((c) => c.id === m.companyId); const isSelf = m.id === user.id; return `<div class="flex items-center justify-between gap-2 rounded-2xl bg-paper-2 p-3"><div><p class="font-bold">${esc(m.name)}${m.disabled ? ' <span class="text-xs text-clay">（已停用）</span>' : ""}</p><p class="text-xs text-muted">${esc(comp?.shortName ?? "平台")} · ${ROLE_LABEL[m.role]} · ${esc(m.phone)}</p></div>${isSelf ? `<span class="rounded-full bg-navy px-3 py-1 text-xs font-bold text-paper">目前身份</span>` : `<button type="button" data-toggle-member="${m.id}" class="min-h-10 rounded-full px-3 text-xs font-bold ${m.disabled ? "bg-gold text-ink" : "border border-line bg-card"}">${m.disabled ? "啟用" : "停用"}</button>`}</div>`; }).join("")}</div>` : ""}
        ${tab === "catalog" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-4"><h2 class="text-xl font-black">常用選項（最多 20 項、每項 16 字）</h2>${[["processes", "常用工序"], ["trades", "常用工種"]].map(([k, lb]) => `<div class="space-y-2"><p class="font-bold">${lb}</p><div class="flex flex-wrap gap-2">${cat[k].map((it) => `<span class="inline-flex items-center gap-1 rounded-full bg-paper-2 py-1 pl-3 pr-2 text-sm">${esc(it)}<button type="button" data-cat-del="${k}:${esc(it)}" class="text-clay font-black">×</button></span>`).join("")}</div><div class="flex gap-2"><input id="cat-in-${k}" placeholder="加一個${lb}" class="min-h-11 flex-1 rounded-2xl border border-line px-3 text-sm" /><button type="button" data-cat-add="${k}" class="min-h-11 rounded-full bg-gold px-4 text-sm font-black text-ink">加入</button></div></div>`).join("")}</div>` : ""}
        ${tab === "deploy" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3"><h2 class="text-xl font-black">一鍵推送 index.html 到 GitHub</h2><p class="text-sm text-muted">Token 只存喺你部機瀏覽器，一掣用 GitHub Contents API 直接覆蓋 <code>index.html</code> 上線。</p><div class="grid gap-2 md:grid-cols-2"><label class="block text-sm"><span>Owner</span><input id="gh-owner" value="${esc(ghSaved.owner || "lm1668-cpu")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label><label class="block text-sm"><span>Repo</span><input id="gh-repo" value="${esc(ghSaved.repo || "dipan-tong")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label><label class="block text-sm"><span>Branch</span><input id="gh-branch" value="${esc(ghSaved.branch || "main")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label><label class="block text-sm"><span>Path</span><input id="gh-path" value="${esc(ghSaved.path || "index.html")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label></div><label class="block text-sm"><span>GitHub Token（Contents: Read &amp; Write）</span><input id="gh-pat" type="password" value="" placeholder="github_pat_..." class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label><div class="flex flex-wrap gap-2"><button type="button" id="btn-gh-push" class="min-h-11 rounded-full bg-gold px-5 text-sm font-black text-ink">一鍵部署 index.html 到 GitHub</button><button type="button" id="btn-gh-save" class="min-h-11 rounded-full bg-paper-2 px-4 text-sm font-bold">儲存本機設定</button></div><div id="gh-deploy-status" class="hidden rounded-2xl px-4 py-3 text-sm font-bold"></div></div>` : ""}
        ${tab === "firebase" ? `<div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3"><h2 class="text-xl font-black">Firebase 雲端設定（renocamp-site）</h2><div class="grid gap-2 md:grid-cols-2">${["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"].map((k) => `<label class="block text-sm"><span>${k}</span><input id="fb-${k}" value="${esc(fbCfg[k] || "")}" class="mt-1 min-h-11 w-full rounded-2xl border border-line px-3 text-sm" /></label>`).join("")}</div><button type="button" id="btn-fb-save" class="min-h-11 rounded-full bg-gold px-5 text-sm font-black text-ink">儲存 Firebase 設定並啟用登入</button></div>` : ""}
        <div class="rounded-3xl border border-line bg-card p-4 shadow-card space-y-3"><h2 class="text-xl font-black">客戶公司訂閱（用量到頂只提醒，唔鎖唔刪）</h2>${state.companies.map((c) => { const p = PLANS[c.plan], sc = state.sites.filter((s) => s.companyId === c.id).length, mc = state.members.filter((m) => m.companyId === c.id).length; return `<div class="rounded-2xl bg-paper-2 p-3 space-y-2"><div class="flex justify-between"><p class="font-bold">${esc(c.name)}</p><span class="rounded-full bg-navy px-2.5 py-0.5 text-xs font-bold text-paper">${p.name}</span></div><p class="text-xs text-muted">工地 ${sc}/${p.sites} · 帳戶 ${mc}/${p.seats} · 儲存 ${c.storageUsedGb}/${p.gb} GB</p>${c.status === "trial" ? `<button type="button" data-extend-trial="${c.id}" class="min-h-10 rounded-full bg-gold px-3 text-xs font-bold text-ink">試用加七日</button>` : ""}</div>`; }).join("")}</div>
      </div>`;
    }

    // =========================================================================
    // Main Render & Event Wiring
    // =========================================================================
    function render() {
      const root = document.getElementById("app"), path = getPath();
      if (path === "/" || path === "") root.innerHTML = renderMarketing();
      else if (path === "/login") root.innerHTML = renderLogin();
      else if (path.startsWith("/app")) {
        let inner = "";
        if (path === "/app" || path === "/app/") inner = renderOverview();
        else if (path === "/app/sites") inner = renderSites();
        else if (path.startsWith("/app/sites/")) inner = renderSiteDetail(path.replace("/app/sites/", ""));
        else if (path === "/app/tasks") inner = renderTasks();
        else if (path === "/app/logs") inner = renderLogs();
        else if (path === "/app/people") inner = renderPeople();
        else if (path === "/app/materials") inner = renderMaterials();
        else if (path === "/app/files") inner = renderFiles();
        else if (path === "/app/reports") inner = renderReports();
        else if (path === "/app/billing") inner = renderBilling();
        else if (path === "/app/admin") inner = renderAdmin();
        else if (path === "/app/account") inner = renderAccount();
        else inner = renderOverview();
        root.innerHTML = renderAppShell(path, inner);
      } else root.innerHTML = renderMarketing();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('a[href^="#/"]').forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const target = (a.getAttribute("href") || "#/").replace(/^#/, "");
          go(target);
        });
      });
      document.querySelectorAll("[data-scroll]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.scroll)?.scrollIntoView({ behavior: "smooth" })));
      document.querySelectorAll("[data-login]").forEach((b) => b.addEventListener("click", () => {
        const m = state.members.find((x) => x.id === b.dataset.login);
        if (!m || m.disabled) return;
        state.sessionUserId = m.id; runtime.authMode = "demo"; runtime.cloudEmail = null; runtime.cloudStatus = "offline"; saveStore();
        go(m.role === "platform_admin" ? "/app/admin" : "/app");
      }));
      document.getElementById("cloud-login-btn")?.addEventListener("click", async () => {
        const res = await cloudLogin(document.getElementById("cloud-email")?.value || "", document.getElementById("cloud-pass")?.value || "");
        if (!res.ok) { const e = document.getElementById("cloud-login-err"); if (e) { e.textContent = res.error; e.classList.remove("hidden"); } return; }
        toast("Firebase 登入成功！");
        go(getUser()?.role === "platform_admin" ? "/app/admin" : "/app");
      });
      document.getElementById("nav-more-btn")?.addEventListener("click", () => { runtime.moreOpen = true; render(); });
      document.getElementById("close-more-bg")?.addEventListener("click", () => { runtime.moreOpen = false; render(); });
      document.getElementById("close-more-x")?.addEventListener("click", () => { runtime.moreOpen = false; render(); });
      document.getElementById("modal-close-bg")?.addEventListener("click", () => { runtime.modal = null; render(); });
      document.getElementById("modal-close-x")?.addEventListener("click", () => { runtime.modal = null; render(); });
      document.querySelectorAll("[data-site-tab]").forEach((b) => b.addEventListener("click", () => { runtime.siteTab = b.dataset.siteTab; render(); }));
      document.querySelectorAll("[data-task-filter]").forEach((b) => b.addEventListener("click", () => { runtime.taskFilter = b.dataset.taskFilter; render(); }));
      document.querySelectorAll("[data-admin-tab]").forEach((b) => b.addEventListener("click", () => { runtime.adminTab = b.dataset.adminTab; render(); }));

      // Open Modals
      document.querySelectorAll("[data-open-modal]").forEach((b) => b.addEventListener("click", () => {
        const t = b.dataset.openModal;
        runtime.modal = t === "snag" ? { type: "task", kind: "snag" } : t === "task" ? { type: "task", kind: "task" } : { type: t };
        render();
      }));
      document.querySelectorAll("[data-open-log]").forEach((b) => b.addEventListener("click", () => { runtime.modal = { type: "log", siteId: b.dataset.openLog }; render(); }));
      document.querySelectorAll("[data-edit-log]").forEach((b) => b.addEventListener("click", () => { runtime.modal = { type: "log", editId: b.dataset.editLog }; render(); }));
      document.querySelectorAll("[data-open-site-task]").forEach((b) => b.addEventListener("click", () => { runtime.modal = { type: "task", kind: "task", siteId: b.dataset.openSiteTask }; render(); }));
      document.querySelectorAll("[data-open-task]").forEach((b) => b.addEventListener("click", () => { runtime.modal = { type: "taskDetail", taskId: b.dataset.openTask, pendingPhotos: [] }; render(); }));

      // Modal: Log
      document.getElementById("ml-proc")?.addEventListener("change", (e) => {
        const v = e.target.value, ta = document.getElementById("ml-work");
        if (v && ta && !ta.value.includes(v)) ta.value = ta.value.trim() ? `${ta.value.trim()}、${v}` : v;
        e.target.value = "";
      });
      document.getElementById("ml-use-checkin")?.addEventListener("click", () => {
        const sid = document.getElementById("ml-site")?.value, dt = document.getElementById("ml-date")?.value;
        const arr = state.checkins.filter((r) => r.siteId === sid && r.date === dt && !r.absent);
        if (!arr.length) return toast("呢個工地今日未有人報到。", "bad");
        const map = new Map();
        for (const r of arr) map.set(r.trade || "雜工", (map.get(r.trade || "雜工") || 0) + 1);
        document.getElementById("ml-hc").value = [...map.entries()].map(([k, v]) => `${k} ${v}`).join("、");
        toast("已帶入今日報到人數");
      });
      document.getElementById("ml-copy-notes")?.addEventListener("click", () => {
        const sid = document.getElementById("ml-site")?.value, dt = document.getElementById("ml-date")?.value;
        const lines = state.checkins.filter((r) => r.siteId === sid && r.date === dt && (r.absent || r.note)).map((r) => (r.absent ? `${r.memberName}去唔到：${r.note}` : `${r.memberName}收工交帶：${r.note}`));
        const ta = document.getElementById("ml-issues");
        ta.value = ta.value.trim() ? `${ta.value.trim()}\n${lines.join("\n")}` : lines.join("\n");
        toast("已寫入問題");
      });
      const submitLog = (asSubmit) => {
        const hcRaw = (document.getElementById("ml-hc")?.value || "").split(/[、,，\n]+/).map((s) => s.trim()).filter(Boolean);
        const headcount = hcRaw.map((part) => { const m = part.match(/^(.+?)\s*(\d+)$/); return m ? { trade: m[1].trim(), count: Number(m[2]) } : { trade: part, count: 1 }; });
        const r = mutSaveLog({ id: runtime.modal?.editId, siteId: document.getElementById("ml-site").value, date: document.getElementById("ml-date").value, weather: document.getElementById("ml-weather").value, authorName: document.getElementById("ml-author").value, noWork: document.getElementById("ml-nowork").checked, work: document.getElementById("ml-work").value, headcount, deliveries: document.getElementById("ml-deliv").value, issues: document.getElementById("ml-issues").value, submit: asSubmit });
        toast(r.ok ? (asSubmit ? "日誌已提交" : "草稿已儲存") : r.error, r.ok ? "ok" : "bad");
        if (r.ok) { runtime.modal = null; render(); }
      };
      document.getElementById("ml-save-draft")?.addEventListener("click", () => submitLog(false));
      document.getElementById("ml-submit")?.addEventListener("click", () => submitLog(true));

      // Modal: Task
      document.getElementById("mt-submit")?.addEventListener("click", () => {
        const r = mutSaveTask({ kind: runtime.modal?.kind || "task", title: document.getElementById("mt-title").value, siteId: document.getElementById("mt-site").value, location: document.getElementById("mt-loc").value, description: document.getElementById("mt-desc").value, assigneeId: document.getElementById("mt-assignee")?.value || null, priority: document.getElementById("mt-prio").value, due: document.getElementById("mt-due").value });
        toast(r.ok ? (r.warning || "任務已開") : r.error, r.ok ? "ok" : "bad");
        if (r.ok) { runtime.modal = null; render(); }
      });

      // Modal: TaskDetail
      const runTD = (cmd) => {
        const r = mutActTask(runtime.modal.taskId, cmd);
        toast(r.ok ? (r.warning || "已更新，操作人同時間已留低") : r.error, r.ok ? "ok" : "bad");
        if (r.ok && cmd.type === "review") runtime.modal.pendingPhotos = [];
        render();
      };
      document.getElementById("td-assign-btn")?.addEventListener("click", () => runTD({ type: "assign", assigneeId: document.getElementById("td-assign-sel").value }));
      document.getElementById("td-start")?.addEventListener("click", () => runTD({ type: "start" }));
      document.getElementById("td-review")?.addEventListener("click", () => runTD({ type: "review", donePhotos: runtime.modal?.pendingPhotos || [] }));
      document.getElementById("td-approve")?.addEventListener("click", () => runTD({ type: "approve" }));
      document.getElementById("td-return")?.addEventListener("click", () => runTD({ type: "return", note: document.getElementById("td-return-note").value }));
      document.getElementById("td-block")?.addEventListener("click", () => runTD({ type: "block", reason: document.getElementById("td-block-reason").value }));
      document.getElementById("td-unblock")?.addEventListener("click", () => runTD({ type: "unblock" }));
      document.getElementById("td-photo")?.addEventListener("change", async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try { const ph = await compressPhoto(f); runtime.modal.pendingPhotos.push(ph); toast("完工相已附上，撳「交去驗收」會一併儲存"); render(); } catch (err) { toast(err.message, "bad"); }
      });

      // Modal: Material / WorkerMat / Site / Person
      document.getElementById("mm-submit")?.addEventListener("click", () => {
        const isW = runtime.modal?.type === "workerMat";
        const r = mutSaveMaterial({ siteId: document.getElementById("mm-site").value, name: document.getElementById("mm-name").value, qty: document.getElementById("mm-qty").value, supplier: document.getElementById("mm-sup")?.value || "", neededBy: document.getElementById("mm-due")?.value || todayISO(), note: document.getElementById("mm-note").value }, isW);
        toast(r.ok ? (isW ? "已交畀公司跟" : "材料跟進已儲存") : r.error, r.ok ? "ok" : "bad");
        if (r.ok) { runtime.modal = null; render(); }
      });
      document.getElementById("ms-submit")?.addEventListener("click", () => {
        const r = mutSaveSite({ name: document.getElementById("ms-name").value, district: document.getElementById("ms-dist").value, address: document.getElementById("ms-addr").value, client: document.getElementById("ms-client").value, supervisorId: document.getElementById("ms-sup").value, targetDate: document.getElementById("ms-date").value, stage: "開工" });
        toast(r.ok ? "工地已開" : r.error, r.ok ? "ok" : "bad");
        if (r.ok) { runtime.modal = null; render(); }
      });
      document.getElementById("mp-submit")?.addEventListener("click", () => {
        const r = mutAddMember({ name: document.getElementById("mp-name").value, role: document.getElementById("mp-role").value, trade: document.getElementById("mp-trade").value, phone: document.getElementById("mp-phone").value });
        toast(r.ok ? "帳戶已加" : r.error, r.ok ? "ok" : "bad");
        if (r.ok) { runtime.modal = null; render(); }
      });

      // Inline Actions: Attendance, DeskLoop, Materials, Trades, Sub assignment
      document.querySelectorAll("[data-arrive]").forEach((b) => b.addEventListener("click", () => { const r = mutArrive(b.dataset.arrive); toast(r.ok ? "已報到" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-leave]").forEach((b) => b.addEventListener("click", () => { const r = mutLeave(b.dataset.leave, prompt("走之前交帶（冇就留空）：") ?? ""); toast(r.ok ? "已收工" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-absent]").forEach((b) => b.addEventListener("click", () => { const r = mutAbsent(b.dataset.absent, prompt("點解今日去唔到：") ?? ""); toast(r.ok ? "已話俾主管知" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-nudge]").forEach((b) => b.addEventListener("click", () => { const r = mutNudge(b.dataset.nudge, prompt("催交訊息：", "請今日收工前交日誌。") ?? ""); toast(r.ok ? "已催主管" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-instruct]").forEach((b) => b.addEventListener("click", () => { const r = mutInstruct(b.dataset.instruct, prompt("落指示：") ?? ""); toast(r.ok ? "指示已落" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-ack-ins]").forEach((b) => b.addEventListener("click", () => { const r = mutAckInstruction(b.dataset.ackIns); toast(r.ok ? "已回覆收到" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-close-day]").forEach((b) => b.addEventListener("click", () => { const r = mutCloseDay(b.dataset.closeDay, prompt("收工交帶：") ?? ""); toast(r.ok ? (r.warning || "呢個盤今日收工") : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-mat-status]").forEach((sel) => sel.addEventListener("change", () => { const r = mutSetMaterialStatus(sel.dataset.matStatus, sel.value); toast(r.ok ? "材料狀態已更新" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-confirm-mat]").forEach((b) => b.addEventListener("click", () => { const r = mutConfirmMaterial(b.dataset.confirmMat); toast(r.ok ? "已確認收到" : r.error, r.ok ? "ok" : "bad"); render(); }));
      document.querySelectorAll("[data-trade-site]").forEach((inp) => inp.addEventListener("change", () => {
        const u = getUser(), s = state.sites.find((x) => x.id === inp.dataset.tradeSite);
        if (!can(u, "edit_site", s)) return;
        s.trades[Number(inp.dataset.tradeIdx)].progress = Number(inp.value);
        saveStore(); render();
      }));
      document.querySelectorAll("[data-toggle-sub-site]").forEach((b) => b.addEventListener("click", () => {
        const u = getUser(), s = state.sites.find((x) => x.id === b.dataset.toggleSubSite), mid = b.dataset.toggleSubId;
        if (!can(u, "assign_sub", s)) return;
        s.assignedSubIds = s.assignedSubIds.includes(mid) ? s.assignedSubIds.filter((x) => x !== mid) : [...s.assignedSubIds, mid];
        saveStore(); render();
      }));

      // Super Admin Actions
      document.querySelectorAll("[data-flag]").forEach((b) => b.addEventListener("click", () => {
        if (!can(getUser(), "view_admin")) return;
        const k = b.dataset.flag; state.featureFlags[k] = !(state.featureFlags[k] ?? true); saveStore(); toast(`已${state.featureFlags[k] ? "開啟" : "關閉"}「${FEATURE_LABELS[k].label}」`); render();
      }));
      document.querySelectorAll("[data-toggle-member]").forEach((b) => b.addEventListener("click", () => {
        const u = getUser(); if (!can(u, "view_admin")) return;
        const m = state.members.find((x) => x.id === b.dataset.toggleMember); if (!m || m.id === u.id) return;
        m.disabled = !m.disabled; saveStore(); toast(`已${m.disabled ? "停用" : "啟用"}${m.name}`); render();
      }));
      document.querySelectorAll("[data-cat-add]").forEach((b) => b.addEventListener("click", () => {
        if (!can(getUser(), "view_admin")) return;
        const k = b.dataset.catAdd, v = (document.getElementById(`cat-in-${k}`)?.value || "").trim();
        if (!v || v.length > 16) return toast("選項必須 1–16 個字", "bad");
        if (state.catalog[k].length >= 20 || state.catalog[k].includes(v)) return toast("已重複或到達 20 項上限", "bad");
        state.catalog[k].push(v); saveStore(); void cloudWrite(["platformConfig", "commonOptions"], state.catalog); toast("已加入選項"); render();
      }));
      document.querySelectorAll("[data-cat-del]").forEach((b) => b.addEventListener("click", () => {
        if (!can(getUser(), "view_admin")) return;
        const [k, label] = b.dataset.catDel.split(":");
        state.catalog[k] = state.catalog[k].filter((x) => x !== label); saveStore(); void cloudWrite(["platformConfig", "commonOptions"], state.catalog); render();
      }));
      document.querySelectorAll("[data-extend-trial]").forEach((b) => b.addEventListener("click", () => {
        if (!can(getUser(), "manage_billing")) return;
        const c = state.companies.find((x) => x.id === b.dataset.extendTrial);
        if (!c || c.status !== "trial") return;
        c.trialEnds = addDays(c.trialEnds && c.trialEnds > todayISO() ? c.trialEnds : todayISO(), 7); saveStore(); toast(`已幫${c.shortName}試用加七日至 ${c.trialEnds}`); render();
      }));
      document.getElementById("btn-gh-save")?.addEventListener("click", () => {
        safeSet(GH_DEPLOY_KEY, JSON.stringify({ owner: document.getElementById("gh-owner").value.trim(), repo: document.getElementById("gh-repo").value.trim(), branch: document.getElementById("gh-branch").value.trim() || "main", path: document.getElementById("gh-path").value.trim() || "index.html", token: document.getElementById("gh-pat").value.trim() }));
        toast("已儲存 GitHub 設定喺呢部瀏覽器");
      });
      const patInput = document.getElementById("gh-pat");
      if (patInput) {
        try { patInput.value = (JSON.parse(safeGet(GH_DEPLOY_KEY) || "{}")).token || ""; } catch {}
      }
      document.getElementById("btn-gh-push")?.addEventListener("click", async () => {
        const btn = document.getElementById("btn-gh-push");
        const box = document.getElementById("gh-deploy-status");
        const showStatus = (msg, bad = false) => {
          if (box) {
            box.textContent = msg;
            box.className = `rounded-2xl px-4 py-3 text-sm font-bold ${bad ? "bg-clay-soft text-clay" : "bg-navy text-paper"}`;
          }
          toast(msg, bad ? "bad" : "ok");
        };
        const owner = document.getElementById("gh-owner").value.trim(), repo = document.getElementById("gh-repo").value.trim(), branch = document.getElementById("gh-branch").value.trim() || "main", path = document.getElementById("gh-path").value.trim() || "index.html", token = document.getElementById("gh-pat").value.trim();
        if (!token) return showStatus("請先貼上 GitHub Token（需 Contents: Read & Write 權限）", true);
        safeSet(GH_DEPLOY_KEY, JSON.stringify({ owner, repo, branch, path, token }));
        if (btn) { btn.disabled = true; btn.textContent = "推送緊去 GitHub…"; }
        showStatus("連線緊 GitHub API…");
        try {
          const clone = document.documentElement.cloneNode(true);
          const appDiv = clone.querySelector("#app"); if (appDiv) appDiv.innerHTML = "";
          const toastDiv = clone.querySelector("#toast-wrap"); if (toastDiv) toastDiv.innerHTML = "";
          clone.querySelectorAll("style").forEach((st) => { if (st.id !== "deitong-style") st.remove(); });
          const cleanHtml = "<!doctype html>\n" + clone.outerHTML;
          if (/(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}/.test(cleanHtml)) {
            return showStatus("安全攔截：偵測到輸出包含 Token，已取消推送。", true);
          }
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}`;
          const headers = { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28" };
          let sha;
          const g = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers });
          if (g.ok) sha = (await g.json()).sha;
          const bytes = new TextEncoder().encode(cleanHtml);
          let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
          const p = await fetch(apiUrl, { method: "PUT", headers, body: JSON.stringify({ message: `deploy: update ${path} from Deitong Super Admin`, content: btoa(bin), branch, ...(sha ? { sha } : {}) }) });
          if (!p.ok) return showStatus(`推送失敗（HTTP ${p.status}）：${(await p.json().catch(() => ({}))).message || "請檢查 Token 權限"}`, true);
          showStatus("已成功由預覽一鍵推送 index.html 到 GitHub！等約 30 秒刷新網頁即見新版。");
        } catch (err) {
          showStatus(`無法由預覽直連 GitHub（${err?.message || "預覽沙盒限制外連"}），請喺 Canvas 下載 index.html 直接拖上倉庫。`, true);
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = "一鍵部署 index.html 到 GitHub"; }
        }
      });
      document.getElementById("btn-fb-save")?.addEventListener("click", () => {
        const cfg = {}; for (const k of ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"]) cfg[k] = (document.getElementById(`fb-${k}`)?.value || "").trim();
        safeSet(FB_CONFIG_KEY, JSON.stringify(cfg)); toast("已儲存 Firebase 設定！"); void initFirebaseIfReady();
      });
      document.getElementById("btn-signout")?.addEventListener("click", async () => {
        if (runtime.fbAuth && fbMods) await fbMods.authMod.signOut(runtime.fbAuth);
        state.sessionUserId = null; runtime.authMode = "demo"; runtime.cloudEmail = null; runtime.cloudStatus = "offline"; saveStore(); go("/");
      });
      document.getElementById("btn-reset-demo")?.addEventListener("click", () => {
        const keep = state.sessionUserId; state = createDemoData(); state.sessionUserId = keep; saveStore(); toast("示範資料已重設"); render();
      });
    }

    void initFirebaseIfReady();
    render();
    })();
  </script>

</body></html>
